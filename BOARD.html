  .ind-done { background: #dcfce7; border: 2px solid #22c55e; }

  .modal-footer { padding: 12px 20px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; background: #f7f8fa; flex-wrap: wrap; }

  footer { text-align: center; font-size: 11px; color: #8b949e; padding: 16px; border-top: 1px solid #e5e7eb; background: #fff; margin-top: 8px; }

      <button class="btn btn-secondary" id="btnBack">↩ Back</button>
      <button class="btn btn-secondary" id="btnAddComment">+ Comment</button>
      <button class="btn btn-danger"    id="btnReset">Reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer>Made with IBM Bob</footer>

<script>
// ── Load data from the embedded JSON block ──────────────────────────────────
const raw = document.getElementById('board-data').textContent;
let data  = JSON.parse(raw);

let activeId = null;

// ── Helpers ─────────────────────────────────────────────────────────────────
const COL_KEY = { 'To Do': 'todo', 'In Progress': 'wip', 'Done': 'done' };
const LABEL   = { todo: 'To Do', wip: 'In Progress', done: 'Done' };
const SC      = { 'To Do': 's-todo', 'In Progress': 's-wip', 'Done': 's-done' };

function getStory(id) { return data.stories.find(s => s.id === id); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  // Epic
  document.getElementById('epicTitle').textContent = data.epic.title;
  document.getElementById('epicDesc').textContent  = data.epic.description;

  // Counts
  const cnt = { todo: 0, wip: 0, done: 0 };
  data.stories.forEach(s => cnt[COL_KEY[s.status]]++);
  ['todo','wip','done'].forEach(k => {
    document.getElementById('cnt' + k.charAt(0).toUpperCase() + k.slice(1)).textContent = cnt[k];
    document.getElementById('h'   + k.charAt(0).toUpperCase() + k.slice(1)).textContent = cnt[k];
  });

  // Progress
  const pct = Math.round((cnt.done / data.stories.length) * 100);
  document.getElementById('epicProgress').style.width = pct + '%';
  document.getElementById('epicLabel').textContent = `${cnt.done} / ${data.stories.length} done`;

  // Cards
  ['todo','wip','done'].forEach(col => {
    const el = document.getElementById('col-' + col);
    el.innerHTML = '';
    data.stories.filter(s => COL_KEY[s.status] === col).forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = s.id;

      let btn = '';
      if (col === 'todo') btn = `<button class="move-btn" data-action="start" data-id="${s.id}">Start</button>`;
      if (col === 'wip')  btn = `<button class="move-btn back" data-action="back" data-id="${s.id}">Back</button>`;
      if (col === 'done') btn = `<button class="move-btn reset" data-action="reset" data-id="${s.id}">Reset</button>`;

      const nc = s.comments.length;
      card.innerHTML = `
        <div class="card-id">${s.id}</div>
        <div class="card-title">${s.title}</div>
        <div class="card-summary">${s.summary}</div>
        <div class="card-footer">
          <span class="badge-type">Story</span>
          ${nc ? `<span class="badge-comments">&#128172; ${nc}</span>` : ''}
          ${btn}
        </div>`;
      el.appendChild(card);
    });
  });
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal(id) {
  const s = getStory(id);
  if (!s) return;
  activeId = id;
  document.getElementById('mId').textContent    = s.id;
  document.getElementById('mTitle').textContent  = s.title;
  document.getElementById('mDesc').textContent   = s.description;
  document.getElementById('commentInput').value  = '';

  const badge = document.getElementById('mStatus');
  badge.textContent = s.status;
  badge.className   = 'status-badge ' + SC[s.status];

  // Comments
  const cl = document.getElementById('mComments');
  if (s.comments.length === 0) {
    cl.innerHTML = '<div class="no-comments">No comments yet.</div>';
  } else {
    cl.innerHTML = s.comments.map(c =>
      `<div class="comment-item"><div class="comment-date">${c.date}</div><div class="comment-text">${c.text}</div></div>`
    ).join('');
  }

  const col = COL_KEY[s.status];
  document.getElementById('btnStart').style.display = col === 'todo' ? '' : 'none';
  document.getElementById('btnDone') .style.display = col === 'wip'  ? '' : 'none';
  document.getElementById('btnBack') .style.display = col === 'wip'  ? '' : 'none';
  document.getElementById('btnReset').style.display = col === 'done' ? '' : 'none';

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  activeId = null;
}

// ── Mutations (UI only — updates in-memory data; file edits use the JSON block) ──
function moveStory(id, action) {
  const s = getStory(id);
  if (!s) return;
  if (action === 'start') s.status = 'In Progress';
  if (action === 'done')  s.status = 'Done';
  if (action === 'back')  s.status = 'To Do';
  if (action === 'reset') s.status = 'To Do';
  toast(`${s.id} → ${s.status}`);
  render();
  if (activeId === id) openModal(id);
}

function addComment(id) {
  const s    = getStory(id);
  const text = document.getElementById('commentInput').value.trim();
  if (!s || !text) return;
  const today = new Date().toISOString().slice(0, 10);
  s.comments.push({ date: today, text });
  document.getElementById('commentInput').value = '';
  toast('Comment added (in-memory only — edit JSON block to persist)');
  render();
  openModal(id);
}

// ── Event delegation ─────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    e.stopPropagation();
    moveStory(actionBtn.dataset.id, actionBtn.dataset.action);
    return;
  }
  const card = e.target.closest('.card');
  if (card) { openModal(card.dataset.id); return; }
  if (e.target.id === 'btnClose' || e.target.id === 'overlay') closeModal();
  if (e.target.id === 'btnStart')  moveStory(activeId, 'start');
  if (e.target.id === 'btnDone')   moveStory(activeId, 'done');
  if (e.target.id === 'btnBack')   moveStory(activeId, 'back');
  if (e.target.id === 'btnReset')  moveStory(activeId, 'reset');
  if (e.target.id === 'btnAddComment') addComment(activeId);
});

render();
</script>
</body>
</html>
