name: "Setup Python 3.11 and benchmark dependencies"
description: "Sets up Python 3.11, restores the pip cache, and installs the package with the requested extras."

inputs:
  extras:
    description: "Comma-separated extras to install (prepended with 'dev,' automatically)"
    default: "benchmark,langchain,openai-agents,mcp"
  cache-key-suffix:
    description: "Suffix used in the pip cache key: pip-{cache-key-suffix}-3.11-<hash>"
    default: "benchmark"
  install-quiet:
    description: "Pass --quiet to pip install"
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: pip-${{ inputs.cache-key-suffix }}-3.11-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          pip-${{ inputs.cache-key-suffix }}-3.11-

    - name: Install package and dependencies
      shell: bash
      run: |
        QUIET_FLAG=""
        if [ "${{ inputs.install-quiet }}" = "true" ]; then
          QUIET_FLAG="--quiet"
        fi
        pip install -e ".[dev,${{ inputs.extras }}]" ${QUIET_FLAG}
