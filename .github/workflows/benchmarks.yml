name: Benchmarks

# Triggers:
#   workflow_dispatch — manual run from the GitHub Actions UI (Actions tab →
#                        "Benchmarks" → "Run workflow").
#   schedule          — weekly, every Sunday at 04:00 UTC.
#   push to main      — runs the full benchmark suite on every merge to main so
#                       regressions are caught before the next weekly run.
#
# Intentionally NOT triggered on every pull_request — the Db2 service
# container takes up to 15 minutes to become healthy and the benchmark suite
# itself takes ~25 min; requiring that on every PR would double CI time.
# PR-blocking performance gates are handled separately by EPIC-17 / BM-20
# (benchmark_micro tier) which runs in the regular ci.yml job (< 90 s,
# no Db2 dependency).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"   # weekly — every Sunday at 04:00 UTC
  push:
    branches: [main]

# contents: write is required only for the gh-pages publish step.
# All other steps need only read access.  The job-level override below
# supplies the narrower set to each step that actually needs write.
permissions:
  contents: read

# Cancel a superseded run on the same branch when a new push arrives so the
# weekly/push runs don't pile up.  workflow_dispatch runs are NOT cancelled
# because they are always intentional one-off invocations.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  benchmark:
    name: "Benchmark suite (Db2 LUW + pytest-benchmark)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Elevated to write so the gh-pages publish step at the end can push.
    permissions:
      contents: write

    env:
      # ── Db2 connection — identical to ci.yml integration-test job ──────────
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      # ── Benchmark output directory ────────────────────────────────────────
      BENCH_OUT: benchmark_results

    steps:
      # ────────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ────────────────────────────────────────────────────────────────────────
      # 2. Python setup
      # ────────────────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-3.11-

      # Install the package with all dependencies needed for the full benchmark
      # suite: dev tools (pytest, ruff, etc.), benchmark extras
      # (pytest-benchmark, pytest-memray, psutil), and all adapter extras so
      # the BM-11 adapter-overhead benchmarks are not skipped.
      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ────────────────────────────────────────────────────────────────────────
      # 3. Db2 service container — exact same setup as ci.yml
      # ────────────────────────────────────────────────────────────────────────
      - name: Write /var/custom TESTDB-creation script
        # Identical to ci.yml integration-test job: mounts a /var/custom script
        # that creates TESTDB with PAGESIZE 32768 (Db2's VECTOR INDEX requires
        # 32 KB pages) via the container's documented post-setup hook.
        # The sed strip ensures the shebang lands at column 0 regardless of
        # this YAML block's indentation.
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2.yml
        # Identical to ci.yml: image icr.io/db2_community/db2:12.1.5.0,
        # port 50000:50000, shm_size 1g, ARCHIVE_LOGS false, health-check polls
        # `db2 connect to TESTDB` every 30 s with up to 30 retries (15 min max).
        run: |
          cat > /tmp/docker-compose.db2.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        # docker compose up --wait blocks until the healthcheck passes.
        # 300s start_period + 30×30s retries = 15 min max.
        run: docker compose -f /tmp/docker-compose.db2.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        # Identical to ci.yml: polls CREATE VECTOR INDEX (the only DDL that
        # contends for catalog-agent slots) up to 20×15s = 300s.
        # A plain CREATE TABLE succeeds even while catalog agents are settling
        # so only the vector-index probe produces a reliable ready signal.
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready (vector index probe passed) after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for benchmark workloads
        # SQL0964C (log full) occurs during the import_scope() benchmark
        # (test_import_throughput_100[resolver_on]) because that variant fires
        # the ingest resolver on every remember() — up to 6 rounds × 100 rows
        # × resolver writes = ~600 high-log-generation transactions.
        # Fix: increase LOGFILSIZ from the default 1024 (4 MB/file) to 4096
        # (16 MB/file).  With LOGPRIMARY 30 + LOGSECOND 64, that gives
        # (30 + 64) × 16 MB = 1504 MB total log space — 4× the previous 376 MB.
        # LOGFILSIZ requires a restart (deactivate + activate) to take effect.
        # This step is wrapped in || true — any error here is non-fatal.
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      # ────────────────────────────────────────────────────────────────────────
      # 4. Run benchmarks
      # ────────────────────────────────────────────────────────────────────────
      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Run Tier-0 micro-benchmarks (no database)
        # Always run first — these complete in < 90 s and are database-independent.
        # Output goes to output_tier0.json; the summary script merges tier0 + tier1
        # into a unified table (--benchmark-append was removed in pytest-benchmark
        # 5.0 so each run writes its own file).
        # No continue-on-error: any pytest failure (exit 1) or bad-argument error
        # (exit 4) must fail the job rather than silently pass.
        run: |
          pytest benchmarks/ -m benchmark_micro \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier0.json" \
            --benchmark-histogram="${BENCH_OUT}/histogram" \
            -v

      - name: Run Tier-1 benchmark suite (benchmark_pr — requires Db2)
        # Writes to output_tier1.json (separate from Tier-0).
        # The summary/HTML generation steps below merge both files.
        # No continue-on-error: a failing benchmark must fail the job.
        run: |
          pytest benchmarks/ -m benchmark_pr \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier1.json" \
            --benchmark-histogram="${BENCH_OUT}/histogram" \
            -v

      # ────────────────────────────────────────────────────────────────────────
      # 5. Generate Job Summary (Markdown table → $GITHUB_STEP_SUMMARY)
      # ────────────────────────────────────────────────────────────────────────
      - name: Generate benchmark Job Summary
        # Runs even when the benchmark step fails so partial results are surfaced.
        # Passes both tier JSON files; the script merges them into one table.
        if: always()
        run: |
          TIER0="${BENCH_OUT}/output_tier0.json"
          TIER1="${BENCH_OUT}/output_tier1.json"
          if [ -f "$TIER0" ] || [ -f "$TIER1" ]; then
            ARGS=""
            [ -f "$TIER0" ] && ARGS="$ARGS $TIER0"
            [ -f "$TIER1" ] && ARGS="$TIER1 $ARGS"
            python scripts/generate_benchmark_summary.py $ARGS \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> No benchmark output found — the benchmark run may have failed before producing results." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # 6. Generate HTML report index for gh-pages
      # ────────────────────────────────────────────────────────────────────────
      - name: Generate HTML report index
        # Runs even when benchmark steps fail so partial results (Tier-0 only,
        # or a failed-run placeholder) are always published.
        # mkdir -p here covers the case where an early step failure meant the
        # "Create benchmark output directory" step never ran — without it the
        # redirect into ${BENCH_OUT}/index.html would fail with ENOENT.
        if: always()
        run: |
          mkdir -p "${BENCH_OUT}"
          TIER0="${BENCH_OUT}/output_tier0.json"
          TIER1="${BENCH_OUT}/output_tier1.json"
          ARGS=""
          [ -f "$TIER0" ] && ARGS="$ARGS $TIER0"
          [ -f "$TIER1" ] && ARGS="$TIER1 $ARGS"
          if [ -n "$ARGS" ]; then
            # At least one tier JSON exists — generate the real report.
            # Let any script error surface rather than swallowing it.
            python scripts/generate_benchmark_summary.py $ARGS \
              --html \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --sha "${{ github.sha }}" \
              --ref "${{ github.ref_name }}" \
              > "${BENCH_OUT}/index.html"
          else
            # No JSON produced at all — write a static placeholder.
            # printf keeps everything on one indented line so the YAML
            # literal-block scalar is never broken by column-0 content.
            printf '<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="utf-8"><title>Benchmark report unavailable</title></head>\n<body><p>No benchmark data was produced for this run.</p></body>\n</html>\n' \
              > "${BENCH_OUT}/index.html"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # 7. Upload artifact (JSON + SVG histograms + HTML index)
      # ────────────────────────────────────────────────────────────────────────
      - name: Upload benchmark artifact
        # if: always() ensures the artifact is uploaded even when benchmark
        # tests fail, so partial results are always downloadable from the run page.
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────────────────
      # 8. Publish HTML report to gh-pages (benchmark run subfolder)
      # ────────────────────────────────────────────────────────────────────────
      - name: Publish benchmark report to gh-pages
        # Only publish on pushes to main and successful scheduled/manual runs
        # (not on pull_request — there isn't one for this workflow anyway, but
        # keep the guard explicit so fork-based PRs never accidentally push
        # to the upstream gh-pages branch).
        # Uses peaceiris/actions-gh-pages to commit the HTML index and all
        # SVG histograms to the gh-pages branch under a run-specific subfolder
        # so every run's report is permanently accessible at:
        #   https://<owner>.github.io/yaadien/benchmarks/<run_number>/
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BENCH_OUT }}
          destination_dir: benchmarks/${{ github.run_number }}
          keep_files: true
          commit_message: "benchmarks: run ${{ github.run_number }} (${{ github.sha }})"

      # ────────────────────────────────────────────────────────────────────────
      # 9. Publish board.html + regenerate root index.html on gh-pages
      # ────────────────────────────────────────────────────────────────────────
      - name: Prepare site root (board.html + index.html)
        # Runs after the benchmark subfolder has been published (step 8) so the
        # new run directory already exists in the gh-pages checkout that
        # peaceiris/actions-gh-pages will use.
        # Strategy:
        #   a) Copy project-management/BOARD.html → site_root/board.html
        #      (makes the board accessible at /yaadien/board.html).
        #   b) Checkout the current gh-pages branch into a temp dir so
        #      generate_site_index.py can scan the existing benchmarks/
        #      subdirectory list (including the run just published) and build
        #      an accurate navigation table.
        #   c) Write the new index.html into a small staging dir and publish it
        #      to the root of gh-pages (keep_files: true so benchmark subdirs
        #      and board.html are preserved).
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          # ── a) Copy board.html into a staging directory ─────────────────────
          mkdir -p site_root_stage
          cp project-management/BOARD.html site_root_stage/board.html

          # ── b) Checkout gh-pages so we can scan the existing run dirs ────────
          # Use a sparse checkout into /tmp/gh-pages-scan; we only need the
          # directory listing of benchmarks/, not the full content.
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          GH_PAGES_SCAN_DIR=$(mktemp -d)
          git worktree add --detach "$GH_PAGES_SCAN_DIR" origin/gh-pages 2>/dev/null \
            || git clone --depth=1 --branch gh-pages \
               "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
               "$GH_PAGES_SCAN_DIR" 2>/dev/null \
            || { echo "Warning: could not clone gh-pages for scan — using empty benchmarks list"; mkdir -p "$GH_PAGES_SCAN_DIR/benchmarks"; }

          # Make sure the just-published run dir appears in the scan root
          # (the peaceiris publish may not be visible yet if git worktree raced
          # ahead; synthesize it so the table is always accurate).
          mkdir -p "$GH_PAGES_SCAN_DIR/benchmarks/${{ github.run_number }}"

          # ── c) Generate index.html pointing at all known runs ────────────────
          python scripts/generate_site_index.py \
            --site-root  "$GH_PAGES_SCAN_DIR" \
            --run-number "${{ github.run_number }}" \
            --sha        "${{ github.sha }}" \
            --ref        "${{ github.ref_name }}" \
            --out        site_root_stage/index.html

          # Clean up worktree (best-effort; errors here are non-fatal)
          git worktree remove --force "$GH_PAGES_SCAN_DIR" 2>/dev/null || true

      - name: Publish site root (board.html + index.html) to gh-pages
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_root_stage
          destination_dir: .
          keep_files: true
          commit_message: "docs(gh-pages): update site root for run ${{ github.run_number }} (${{ github.sha }})"

      # ────────────────────────────────────────────────────────────────────────
      # 10. Debug: print Db2 container logs on failure
      # ────────────────────────────────────────────────────────────────────────
      - name: Print Db2 container logs (last 100 lines) on failure
        # Only runs when a previous step failed so the logs are not printed on
        # every successful run (they are several thousand lines long).
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # EPIC-15 / BM-12 + BM-13 — Locust isolation gate
  #
  # Runs on every push to main, every weekly schedule run, and on
  # workflow_dispatch — the same cadence as the existing pytest-benchmark job.
  #
  # Two Locust invocations, back-to-back against the same Db2 container:
  #
  #   1. locustfile.py → SDK5User (BM-12 smoke):
  #      50 VUs, 5/s ramp, 3 min — verifies the gevent-threadpool harness works
  #      and the five core operations return results without errors.
  #      Exit non-zero if failure ratio exceeds 1 % (--fail-ratio 0.01).
  #
  #   2. isolation_user.py → IsolationUser + SharedStoreIsolationUser (BM-13):
  #      200 VUs, 10/s ramp, 5 min — asserts zero cross-scope leakage at scale.
  #      The locustfile itself calls runner.quit() + sets process_exit_code=1 on
  #      any LeakageError, so a non-zero exit is the leakage gate (AC-3 / BM-13).
  #
  # Total wall-clock budget: ≈ 3 + 5 = 8 min + Db2 startup (≤ 15 min) = ≤ 23 min.
  # timeout-minutes is set to 45 to allow for a slow Db2 startup on a loaded runner.
  # ────────────────────────────────────────────────────────────────────────────
  locust-isolation:
    name: "Locust isolation gate (BM-12 + BM-13)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      # ── Db2 connection — identical to the benchmark job above ────────────────
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      # ── Locust output directory ───────────────────────────────────────────────
      LOCUST_OUT: locust_results

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-locust-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-locust-3.11-

      # locust>=2.26 is in the [benchmark] extra; the mcp/langchain/openai-agents
      # extras are included so the full SDK surface is importable at runtime.
      - name: Install package and Locust dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ── 3. Db2 service container ─────────────────────────────────────────────
      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2.yml
        run: |
          cat > /tmp/docker-compose.db2-locust.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-locust.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for Locust workloads
        # LOGFILSIZ 4096 (16 MB/file) × (LOGPRIMARY 30 + LOGSECOND 64) = 1504 MB
        # — matches the benchmark job; prevents SQL0964C under sustained load.
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      # ── 4. Run Locust tests ───────────────────────────────────────────────────
      - name: Create Locust output directory
        run: mkdir -p "$LOCUST_OUT"

      - name: "BM-12 smoke — SDK5User (50 VUs, 3 min)"
        # Verifies the gevent-threadpool harness starts cleanly and the five core
        # SDK operations complete without errors at moderate concurrency.
        # --fail-ratio 0.01 → exit non-zero if more than 1 % of requests fail.
        # A non-zero exit here fails the job immediately.
        run: |
          locust \
            -f benchmarks/load/locustfile.py \
            --user-classes SDK5User \
            --headless -u 50 -r 5 -t 3m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_OUT}/bm12_smoke"

      - name: "BM-13 isolation gate — IsolationUser + SharedStoreIsolationUser (200 VUs, 5 min)"
        # This is the primary isolation correctness gate.
        # isolation_user.py registers an @events.request listener that calls
        # runner.quit() and sets process_exit_code=1 on any LeakageError, so
        # a non-zero exit here means cross-scope data leakage was detected.
        # No --fail-ratio flag needed — the module's own exit-code contract
        # is the gate (AC-3).
        run: |
          locust \
            -f benchmarks/load/isolation_user.py \
            --user-classes IsolationUser SharedStoreIsolationUser \
            --headless -u 200 -r 10 -t 5m \
            --csv "${LOCUST_OUT}/bm13_isolation"

      # ── 5. Upload Locust CSV results as an artifact ──────────────────────────
      - name: Upload Locust isolation results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-isolation-report
          path: ${{ env.LOCUST_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      # ── 6. Debug: print Db2 container logs on failure ────────────────────────
      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # EPIC-15 / BM-14 + BM-15 — Locust scalability sweeps + pool saturation
  #
  # Runs only on the weekly schedule and on workflow_dispatch — NOT on every
  # push to main, because the sweep matrix (user ramp + agent sweep + mixed R/W
  # + 4-point pool-size sweep) takes ≈ 25–30 min total.
  #
  # Job structure:
  #   BM-14 scalability sweeps (scalability_tasks.py):
  #     a) UserRampUser       — 200 VUs, 2/s ramp, 5 min
  #     b) AgentSweepUser     — BENCH_N_AGENTS=100, 50 VUs, 5 min
  #     c) MixedReadWriteUser — BENCH_RW_RATIO=70/30, 50 VUs, 3 min
  #
  #   BM-15 pool saturation (pool_saturation_user.py):
  #     DB2_POOL_SIZE in {1, 5, 10, 20} — 50 VUs, 2 min each
  #     OverSaturationUser  — DB2_POOL_SIZE=1, 10 VUs (demonstrates graceful exhaustion)
  #
  # Agent-count sweep targets are reduced from the full spec (10/100/1000) to
  # 100 for CI to keep the job inside a 45-minute budget.  The full 1000-agent
  # sweep is documented in BENCHMARKS.md as a manual run.
  #
  # timeout-minutes: 60 allows for Db2 startup + all sweep steps.
  # ────────────────────────────────────────────────────────────────────────────
  locust-scale:
    name: "Locust scalability sweeps + pool saturation (BM-14 + BM-15)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only on schedule/dispatch — not on every push to main (too slow).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      LOCUST_OUT: locust_scale_results

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-locust-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-locust-3.11-

      - name: Install package and Locust dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ── 3. Db2 service container ─────────────────────────────────────────────
      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-scale.yml
        run: |
          cat > /tmp/docker-compose.db2-scale.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-scale.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for scale workloads
        # LOGFILSIZ 4096 (16 MB/file) × (LOGPRIMARY 30 + LOGSECOND 64) = 1504 MB
        # — matches the benchmark job; prevents SQL0964C under sustained Locust load.
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      # ── 4. BM-14 scalability sweeps ──────────────────────────────────────────
      - name: Create Locust output directory
        run: mkdir -p "$LOCUST_OUT"

      - name: "BM-14a — UserRampUser (200 VUs, 2/s ramp, 5 min)"
        # Exercises the 1→200 VU ramp.  P95 inflection is visible in the CSV.
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --user-classes UserRampUser \
            --headless -u 200 -r 2 -t 5m \
            --csv "${LOCUST_OUT}/bm14a_user_ramp"

      - name: "BM-14b — AgentSweepUser (BENCH_N_AGENTS=100, 50 VUs, 5 min)"
        # CI-scoped to 100 agents (from 1000) to keep the job within budget.
        # The full 1000-agent run is documented in BENCHMARKS.md as a manual run.
        env:
          BENCH_N_AGENTS: "100"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --user-classes AgentSweepUser \
            --headless -u 50 -r 5 -t 5m \
            --csv "${LOCUST_OUT}/bm14b_agent_sweep"

      - name: "BM-14c — MixedReadWriteUser (70/30 read-heavy, 50 VUs, 3 min)"
        # Read-heavy mix; the WriterStarvationWarning shows up in the Locust CSV
        # as a named failure category if writer starvation occurs.
        env:
          BENCH_RW_RATIO: "70/30"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --user-classes MixedReadWriteUser \
            --headless -u 50 -r 5 -t 3m \
            --csv "${LOCUST_OUT}/bm14c_mixed_rw"

      # ── 5. BM-15 pool-saturation sweep ───────────────────────────────────────
      - name: "BM-15 pool=1 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --user-classes PoolSaturationUser \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool1"

      - name: "BM-15 pool=5 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --user-classes PoolSaturationUser \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool5"

      - name: "BM-15 pool=10 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "10"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --user-classes PoolSaturationUser \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool10"

      - name: "BM-15 pool=20 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --user-classes PoolSaturationUser \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool20"

      - name: "BM-15 graceful-exhaustion check — OverSaturationUser (pool=1, 10 VUs, 1 min)"
        # Demonstrates that ConnectionPoolExhausted is raised (not a hang) when
        # more VUs than pool connections hit the pool simultaneously.
        # Exit code is deliberately ignored (|| true) because OverSaturationUser
        # WILL produce failures — that is the expected, correct behaviour.
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --user-classes OverSaturationUser \
            --headless -u 10 -r 10 -t 1m \
            --csv "${LOCUST_OUT}/bm15_oversaturate" || true

      # ── 6. Upload Locust scale results as an artifact ─────────────────────────
      - name: Upload Locust scale results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-scale-report
          path: ${{ env.LOCUST_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      # ── 7. Generate Job Summary for scale results ─────────────────────────────
      - name: Generate scale benchmark Job Summary
        # Writes a lightweight Markdown summary of the CSV stats files to the
        # GitHub Step Summary so results are visible directly on the run page
        # without downloading the artifact.
        if: always()
        run: |
          echo "## Locust Scale Results (BM-14 + BM-15)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for csv in "${LOCUST_OUT}"/*_stats.csv; do
            [ -f "$csv" ] || continue
            label=$(basename "$csv" _stats.csv)
            echo "### ${label}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -3 "$csv" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # ── 8. Debug: print Db2 container logs on failure ─────────────────────────
      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi
