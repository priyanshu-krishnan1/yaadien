# ==============================================================================
# CONSOLIDATED BENCHMARK WORKFLOW
# ==============================================================================
#
# This file merges all benchmark-related GitHub Actions workflows into a single
# manually-triggered workflow.  The following original files were consolidated
# here and have been DEPRECATED:
#
#   - .github/workflows/benchmark-nightly.yml  (was: "Benchmark Nightly")
#   - .github/workflows/benchmark-pr.yml       (was: "Benchmark PR gate")
#   - .github/workflows/benchmark-scale.yml    (was: "Benchmark — Tier 3 Scale")
#   - .github/workflows/benchmarks.yml         (was: "Benchmarks" — prior version)
#
# ── IMPORTANT: PR REQUIRED-STATUS-CHECKS NOTE ─────────────────────────────────
#
# This workflow is intentionally EXCLUDED from branch-protection required status
# checks and will NEVER appear as a PR gate.  Reasons:
#
#   1. trigger: workflow_dispatch ONLY — it cannot run on a pull_request event.
#   2. The former "Benchmark PR gate" codspeed and benchmark-pr jobs that ran on
#      pull_request have been removed from this file.  Those jobs should be
#      re-instated as a separate lightweight PR-only file if a PR gate is needed.
#   3. No required-check registration should reference "Benchmarks (unified)" or
#      any job id defined in this file.
#
# To run benchmarks: Repository → Actions → "Benchmarks (unified)" → Run workflow
# ==============================================================================

name: Benchmarks (unified)

on:
  workflow_dispatch:
    inputs:
      # ── benchmark-nightly inputs ────────────────────────────────────────────
      corpus_size:
        description: "[nightly] Seed corpus size: 1k / 50k / 500k"
        required: false
        default: "50k"
      scenario:
        description: "[nightly] Scenario filter: full / locust / ir-metrics"
        required: false
        default: "full"
      # ── benchmark-scale inputs ──────────────────────────────────────────────
      tenant_prefix:
        description: "[scale] Reserved tenant_id prefix (default: bm22-scale)"
        default: "bm22-scale"
        required: false
      dry_run:
        description: "[scale] If true, skip actual benchmark steps (connectivity check only)"
        type: boolean
        default: false

# ==============================================================================
# PERMISSIONS
# contents: write — gh-pages publish steps + BENCHMARKS.md commit-back.
# issues: write   — opening regression issues on nightly/scale failure.
# ==============================================================================
permissions:
  contents: write
  issues: write

# ==============================================================================
# CONCURRENCY
# Each job group has its own concurrency key so jobs from the same origin
# workflow don't queue behind each other unnecessarily.
# ==============================================================================

jobs:

  # ============================================================================
  # JOB 1: codspeed
  # Origin: benchmark-pr.yml → "Tier 0 — CodSpeed micro-benchmark smoke test"
  # ============================================================================
  codspeed:
    name: "Tier 0 — CodSpeed micro-benchmark smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-codspeed-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-codspeed-3.11-

      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Run micro-benchmarks with pytest-codspeed
        run: pytest benchmarks/micro/ -m benchmark_micro --codspeed --no-cov -v

  # ============================================================================
  # JOB 2: benchmark
  # Origin: benchmarks.yml (prior) → "Benchmark suite (Db2 LUW + pytest-benchmark)"
  # ============================================================================
  benchmark:
    name: "Benchmark suite (Db2 LUW + pytest-benchmark)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      BENCH_OUT: benchmark_results

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-3.11-

      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2.yml
        run: |
          cat > /tmp/docker-compose.db2.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready (vector index probe passed) after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for benchmark workloads
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Run Tier-0 micro-benchmarks (no database)
        run: |
          pytest benchmarks/ -m benchmark_micro \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier0.json" \
            --benchmark-histogram="${BENCH_OUT}/histogram" \
            -v

      - name: Run Tier-1 benchmark suite (benchmark_pr — requires Db2)
        run: |
          pytest benchmarks/ -m benchmark_pr \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier1.json" \
            --benchmark-histogram="${BENCH_OUT}/histogram" \
            -v

      - name: Run Tier-2 quality suite (benchmark_nightly — EPIC-16, workflow_dispatch only)
        run: |
          pytest benchmarks/quality/ -m benchmark_nightly \
            --no-cov \
            -v \
            --tb=short

      - name: Generate benchmark Job Summary
        if: always()
        run: |
          TIER0="${BENCH_OUT}/output_tier0.json"
          TIER1="${BENCH_OUT}/output_tier1.json"
          if [ -f "$TIER0" ] || [ -f "$TIER1" ]; then
            ARGS=""
            [ -f "$TIER0" ] && ARGS="$ARGS $TIER0"
            [ -f "$TIER1" ] && ARGS="$TIER1 $ARGS"
            python scripts/generate_benchmark_summary.py $ARGS \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> No benchmark output found — the benchmark run may have failed before producing results." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate HTML report index
        if: always()
        run: |
          mkdir -p "${BENCH_OUT}"
          TIER0="${BENCH_OUT}/output_tier0.json"
          TIER1="${BENCH_OUT}/output_tier1.json"
          ARGS=""
          [ -f "$TIER0" ] && ARGS="$ARGS $TIER0"
          [ -f "$TIER1" ] && ARGS="$TIER1 $ARGS"
          if [ -n "$ARGS" ]; then
            python scripts/generate_benchmark_summary.py $ARGS \
              --html \
              --run-id "${{ github.run_id }}" \
              --run-number "${{ github.run_number }}" \
              --sha "${{ github.sha }}" \
              --ref "${{ github.ref_name }}" \
              > "${BENCH_OUT}/index.html"
          else
            printf '<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="utf-8"><title>Benchmark report unavailable</title></head>\n<body><p>No benchmark data was produced for this run.</p></body>\n</html>\n' \
              > "${BENCH_OUT}/index.html"
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Publish benchmark report to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BENCH_OUT }}
          destination_dir: benchmarks/${{ github.run_number }}
          keep_files: true
          commit_message: "benchmarks: run ${{ github.run_number }} (${{ github.sha }})"

      - name: Prepare site root (board.html + index.html)
        if: always()
        run: |
          mkdir -p site_root_stage
          cp project-management/BOARD.html site_root_stage/board.html
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          GH_PAGES_SCAN_DIR=$(mktemp -d)
          git worktree add --detach "$GH_PAGES_SCAN_DIR" origin/gh-pages 2>/dev/null \
            || git clone --depth=1 --branch gh-pages \
               "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
               "$GH_PAGES_SCAN_DIR" 2>/dev/null \
            || { echo "Warning: could not clone gh-pages for scan — using empty benchmarks list"; mkdir -p "$GH_PAGES_SCAN_DIR/benchmarks"; }
          mkdir -p "$GH_PAGES_SCAN_DIR/benchmarks/${{ github.run_number }}"
          python scripts/generate_site_index.py \
            --site-root  "$GH_PAGES_SCAN_DIR" \
            --run-number "${{ github.run_number }}" \
            --sha        "${{ github.sha }}" \
            --ref        "${{ github.ref_name }}" \
            --out        site_root_stage/index.html
          git worktree remove --force "$GH_PAGES_SCAN_DIR" 2>/dev/null || true

      - name: Publish site root (board.html + index.html) to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_root_stage
          destination_dir: .
          keep_files: true
          commit_message: "docs(gh-pages): update site root for run ${{ github.run_number }} (${{ github.sha }})"

      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ============================================================================
  # JOB 3: locust-isolation
  # Origin: benchmarks.yml (prior) → "Locust isolation gate (BM-12 + BM-13)"
  # ============================================================================
  locust-isolation:
    name: "Locust isolation gate (BM-12 + BM-13)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      LOCUST_OUT: locust_results

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-locust-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-locust-3.11-

      - name: Install package and Locust dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-locust.yml
        run: |
          cat > /tmp/docker-compose.db2-locust.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-locust.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for Locust workloads
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      - name: Create Locust output directory
        run: mkdir -p "$LOCUST_OUT"

      - name: "BM-12 smoke — SDK5User (50 VUs, 3 min)"
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/locustfile.py \
            --headless -u 50 -r 5 -t 3m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_OUT}/bm12_smoke" \
            SDK5User

      - name: "BM-13 isolation gate — IsolationUser + SharedStoreIsolationUser (200 VUs, 5 min)"
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/isolation_user.py \
            --headless -u 200 -r 10 -t 5m \
            --csv "${LOCUST_OUT}/bm13_isolation" \
            IsolationUser SharedStoreIsolationUser

      - name: Upload Locust isolation results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-isolation-report
          path: ${{ env.LOCUST_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-locust.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ============================================================================
  # JOB 4: locust-scale
  # Origin: benchmarks.yml (prior) → "Locust scalability sweeps + pool saturation (BM-14 + BM-15)"
  # ============================================================================
  locust-scale:
    name: "Locust scalability sweeps + pool saturation (BM-14 + BM-15)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      LOCUST_OUT: locust_scale_results

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-locust-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-locust-3.11-

      - name: Install package and Locust dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-scale.yml
        run: |
          cat > /tmp/docker-compose.db2-scale.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-scale.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for scale workloads
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      - name: Create Locust output directory
        run: mkdir -p "$LOCUST_OUT"

      - name: "BM-14a — UserRampUser (200 VUs, 2/s ramp, 5 min)"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 200 -r 2 -t 5m \
            --csv "${LOCUST_OUT}/bm14a_user_ramp" \
            UserRampUser

      - name: "BM-14b — AgentSweepUser (BENCH_N_AGENTS=100, 50 VUs, 5 min)"
        env:
          BENCH_N_AGENTS: "100"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 5m \
            --csv "${LOCUST_OUT}/bm14b_agent_sweep" \
            AgentSweepUser

      - name: "BM-14c — MixedReadWriteUser (70/30 read-heavy, 50 VUs, 3 min)"
        env:
          BENCH_RW_RATIO: "70/30"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 3m \
            --csv "${LOCUST_OUT}/bm14c_mixed_rw" \
            MixedReadWriteUser

      - name: "BM-15 pool=1 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool1" \
            PoolSaturationUser

      - name: "BM-15 pool=5 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool5" \
            PoolSaturationUser

      - name: "BM-15 pool=10 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "10"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool10" \
            PoolSaturationUser

      - name: "BM-15 pool=20 (PoolSaturationUser, 50 VUs, 2 min)"
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_OUT}/bm15_pool20" \
            PoolSaturationUser

      - name: "BM-15 graceful-exhaustion check — OverSaturationUser (pool=1, 10 VUs, 1 min)"
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 10 -r 10 -t 1m \
            --csv "${LOCUST_OUT}/bm15_oversaturate" \
            OverSaturationUser || true

      - name: Upload Locust scale results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-scale-report
          path: ${{ env.LOCUST_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Generate scale benchmark Job Summary
        if: always()
        run: |
          echo "## Locust Scale Results (BM-14 + BM-15)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for csv in "${LOCUST_OUT}"/*_stats.csv; do
            [ -f "$csv" ] || continue
            label=$(basename "$csv" _stats.csv)
            echo "### ${label}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -3 "$csv" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-scale.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ============================================================================
  # JOB 5: benchmark-nightly
  # Origin: benchmark-nightly.yml → "Nightly benchmark suite — Tier 2 (BM-21)"
  # ============================================================================
  benchmark-nightly:
    name: "Nightly benchmark suite — Tier 2 (BM-21)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      BENCH_OUT: benchmark_nightly_results
      CORPUS_SIZE: ${{ inputs.corpus_size || '50k' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-nightly-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-nightly-3.11-
            pip-benchmark-3.11-

      - name: Install package and all benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-nightly.yml
        run: |
          cat > /tmp/docker-compose.db2-nightly.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-nightly.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready (vector index probe passed) after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for nightly workloads
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Seed corpus (${{ env.CORPUS_SIZE }} rows)
        if: inputs.scenario != 'ir-metrics'
        run: |
          python benchmarks/seed_corpus.py \
            --size "${CORPUS_SIZE}" \
            --seed 42 \
            --cardinality-category 5 \
            --cardinality-topic 20

      - name: Run Tier-0 + Tier-1 benchmark suite (benchmark_micro + benchmark_pr)
        if: inputs.scenario != 'ir-metrics'
        run: |
          pytest benchmarks/ -m "benchmark_micro or benchmark_pr" \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_benchmark.json" \
            -v

      - name: "BM-14 Locust ramp — MixedReadWriteUser (50 VUs, 15 min, 70/30)"
        if: inputs.scenario != 'ir-metrics'
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 15m \
            --fail-ratio 0.01 \
            --csv "${BENCH_OUT}/nightly_locust" \
            MixedReadWriteUser

      - name: "BM-15 pool-saturation sweep — pool=5 (50 VUs, 2 min)"
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool5" \
            PoolSaturationUser

      - name: "BM-15 pool-saturation sweep — pool=20 (50 VUs, 2 min)"
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool20" \
            PoolSaturationUser

      - name: "BM-17 IR metrics — benchmark_nightly suite (LongMemEval-S)"
        id: ir_nightly
        if: inputs.scenario != 'locust'
        continue-on-error: true
        run: |
          pytest benchmarks/quality/ -m benchmark_nightly \
            --no-cov \
            -v \
            --tb=short
          echo "ir_nightly_ran=true" >> "$GITHUB_OUTPUT"

      - name: "BM-17 IR metrics — fallback to benchmark_micro (BM-17 not yet implemented)"
        if: |
          inputs.scenario != 'locust' &&
          steps.ir_nightly.outputs.ir_nightly_ran != 'true'
        run: |
          echo "benchmark_nightly marker collected no tests — falling back to benchmark_micro."
          pytest benchmarks/quality/ -m benchmark_micro \
            --no-cov \
            -v \
            --tb=short

      - name: "AGQ-2 — task-completion Pass¹/Pass⁵ (flat_context, no Db2)"
        id: agq2
        if: inputs.scenario != 'locust'
        run: |
          python -m benchmarks.agent_quality.tasks \
            --condition flat_context \
            --judge-model llama3.1:8b \
            --seed 42 \
            --output "${BENCH_OUT}/agq2.json"
          echo "agq2_ran=true" >> "$GITHUB_OUTPUT"

      - name: "AGQ-3 — groundedness judge (LongMemEval-S, with Db2)"
        id: agq3
        if: inputs.scenario != 'locust' && inputs.scenario != 'ir-metrics'
        continue-on-error: true
        env:
          LONGMEMEVAL_CACHE_DIR: ~/.cache/longmemeval
        run: |
          python -m benchmarks.agent_quality.groundedness \
            --judge-model llama3.1:8b \
            --seed 42 \
            --n-per-category 4 \
            --output "${BENCH_OUT}/agq3.json" || true
          if [ -f "${BENCH_OUT}/agq3.json" ]; then
            echo "agq3_ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "AGQ-4 — coherence/fluency judge (LongMemEval-S, with Db2)"
        id: agq4
        if: inputs.scenario != 'locust' && inputs.scenario != 'ir-metrics'
        continue-on-error: true
        env:
          LONGMEMEVAL_CACHE_DIR: ~/.cache/longmemeval
        run: |
          python -m benchmarks.agent_quality.coherence \
            --judge-model llama3.1:8b \
            --seed 42 \
            --n-per-category 4 \
            --output "${BENCH_OUT}/agq4.json" || true
          if [ -f "${BENCH_OUT}/agq4.json" ]; then
            echo "agq4_ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "AGQ-5 — merge AGQ-2/3/4 into agq_results.json (scorecard input)"
        if: inputs.scenario != 'locust'
        run: |
          python benchmarks/agent_quality/run_agq.py \
            --agq2-json "${BENCH_OUT}/agq2.json" \
            --agq3-json "${BENCH_OUT}/agq3.json" \
            --agq4-json "${BENCH_OUT}/agq4.json" \
            --output    "${BENCH_OUT}/agq_results.json"

      - name: "Scorecard — generate MBS composite from all suite outputs"
        if: inputs.scenario != 'locust'
        continue-on-error: true
        run: |
          python -m benchmarks.common.scorecard \
            --perf-json   "${BENCH_OUT}/output_benchmark.json" \
            --baselines   benchmarks/baselines.json \
            --agq-json    "${BENCH_OUT}/agq_results.json" \
            --append-to   project-management/BENCHMARKS.md \
            || true

      - name: Generate benchmark Job Summary
        if: always()
        run: |
          BENCH_JSON="${BENCH_OUT}/output_benchmark.json"
          if [ -f "$BENCH_JSON" ]; then
            python scripts/generate_benchmark_summary.py "$BENCH_JSON" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Nightly Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> No benchmark JSON found — the pytest step may have been skipped or failed." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-nightly-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish nightly results to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BENCH_OUT }}
          destination_dir: benchmarks/nightly/${{ github.run_number }}
          keep_files: true
          commit_message: "benchmarks(nightly): run ${{ github.run_number }} (${{ github.sha }})"

      - name: Open regression issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly benchmark regression — run ${{ github.run_number }}`,
              body: [
                '## Nightly benchmark regression detected',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                `**Commit:** ${{ github.sha }}`,
                `**Triggered by:** ${{ github.event_name }}`,
                '',
                'One or more nightly benchmark steps failed. Check the workflow run for details.',
                '',
                '**Labels:** benchmark, regression',
              ].join('\n'),
              labels: ['benchmark', 'regression'],
            });

      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi

  # ============================================================================
  # JOB 6: benchmark-scale
  # Origin: benchmark-scale.yml → "Tier 3 weekly scale benchmark (live Db2)"
  # ============================================================================
  benchmark-scale:
    name: "Tier 3 weekly scale benchmark (live Db2)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: live-db2
    permissions:
      contents: write
      issues: write

    env:
      DB2_DATABASE: ${{ secrets.LIVE_DB2_DATABASE }}
      DB2_HOSTNAME: ${{ secrets.LIVE_DB2_HOSTNAME }}
      DB2_PORT:     ${{ secrets.LIVE_DB2_PORT }}
      DB2_UID:      ${{ secrets.LIVE_DB2_UID }}
      DB2_PWD:      ${{ secrets.LIVE_DB2_PWD }}
      BENCH_OUT: benchmark_scale_results
      BENCH_TENANT_PREFIX: ${{ inputs.tenant_prefix || 'bm22-scale' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-3.11-

      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      - name: Verify live Db2 connectivity
        run: |
          python scripts/check_connection.py || {
            echo "::error::Cannot reach live Db2 instance. Aborting scale benchmark to avoid wasted runner time."
            exit 1
          }

      - name: Seed 500k corpus (tenant prefix ${{ env.BENCH_TENANT_PREFIX }})
        if: ${{ inputs.dry_run != true }}
        run: |
          python benchmarks/seed_corpus.py \
            --size 500k \
            --seed 99 \
            --cardinality-category 10 \
            --cardinality-topic 50

      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Run full benchmark matrix at 500k rows (benchmark_pr)
        if: ${{ inputs.dry_run != true }}
        run: |
          pytest benchmarks/ -m "benchmark_pr" \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_scale.json" \
            -v

      - name: "Locust scale ramp (BM-14) — 200 VUs, 15 min, 70/30 mix"
        if: ${{ inputs.dry_run != true }}
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 200 -r 5 -t 15m \
            --fail-ratio 0.01 \
            --csv "${BENCH_OUT}/scale_locust" \
            UserRampUser MixedReadWriteUser

      - name: "Deterministic IR metrics at scale (benchmark_nightly + benchmark_micro)"
        if: ${{ inputs.dry_run != true }}
        run: |
          pytest benchmarks/quality/ -m "benchmark_nightly or benchmark_micro" \
            --no-cov \
            -v

      - name: Commit results to BENCHMARKS.md
        if: success()
        run: |
          python scripts/generate_benchmark_summary.py \
            "${BENCH_OUT}/output_scale.json" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            > /tmp/scale_summary.md
          {
            echo ""
            echo "## Tier 3 Scale Run — $(date -u +%Y-%m-%d) (run ${{ github.run_number }})"
            cat /tmp/scale_summary.md
          } >> BENCHMARKS.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add BENCHMARKS.md
          git diff --cached --quiet || git commit -m "benchmarks: tier-3 scale results run ${{ github.run_number }} (${{ github.sha }})"
          git push

      - name: Generate Job Summary
        if: always()
        run: |
          python scripts/generate_benchmark_summary.py "${BENCH_OUT}/output_scale.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark scale report artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-scale-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Open regression issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Tier 3 scale benchmark regression — run ${{ github.run_number }}`,
              body: [
                '## Tier 3 (live Db2) scale benchmark regression',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                `**Commit:** ${{ github.sha }}`,
                `**Triggered by:** ${{ github.event_name }}`,
                '',
                'One or more Tier 3 scale benchmark steps failed against the live Db2 instance.',
                '',
                '### Manual abort and cleanup',
                'If this run appears hung (> 3 hours), use the GitHub Actions UI to cancel it.',
                'To clean up test data on the live Db2 instance after an aborted run:',
                '```sql',
                "-- Replace 'bm22-scale' with the tenant_prefix used in the hung run",
                "DELETE FROM working_memory WHERE tenant_id LIKE 'bm22-scale-%';",
                "-- Repeat for all memory tables (semantic_facts, episodic_events, etc.)",
                '```',
                '',
                '**Labels:** benchmark, regression, scale',
              ].join('\n'),
              labels: ['benchmark', 'regression'],
            });
