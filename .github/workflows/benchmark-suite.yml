# ==============================================================================
# Benchmark workflow — runs nightly (Mon–Fri 02:00 UTC) and on demand.
# To run it: Actions tab → "Benchmarks (unified)" → Run workflow → pick a suite.
# ==============================================================================

name: Benchmarks (unified)

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run (default: all)"
        required: false
        type: choice
        options:
          - all
          - micro-benchmarks
          - core-suites
          - memory-quality
          - scale-performance
        default: all
      # Only used when suite = "memory-quality"
      corpus_size:
        description: "[nightly] Seed corpus size: 1k / 50k / 500k"
        required: false
        default: "50k"
      scenario:
        description: "[nightly] Scenario filter: full / locust / ir-metrics"
        required: false
        default: "full"
      # Only used when suite = "scale-performance"
      tenant_prefix:
        description: "[scale] Reserved tenant_id prefix (default: bm22-scale)"
        default: "bm22-scale"
        required: false
      dry_run:
        description: "[scale] If true, skip actual benchmark steps (connectivity check only)"
        type: boolean
        default: false

# "issues: write" lets a failed run file a GitHub issue automatically.
# Nothing writes to the repo itself — results are workflow artifacts only.
permissions:
  issues: write

# If you start a new run while one is already going, it waits in line
# instead of cancelling the first one — these runs are long, so queuing
# is safer than throwing away progress.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  DB2_IMAGE: icr.io/db2_community/db2:12.1.5.0

jobs:

  # Runs when suite = "micro-benchmarks" (or "all").
  # Times small functions — no database involved.
  codspeed:
    name: "Measure small function speed"
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'micro-benchmarks')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download repo code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python packages
        uses: ./.github/actions/setup-bench-python
        with:
          cache-key-suffix: codspeed
          extras: benchmark,langchain,openai-agents,mcp

      - name: Measure function speed
        env:
          CODSPEED_TOKEN: ${{ secrets.CODSPEED_TOKEN }}
        run: pytest benchmarks/micro/ -m benchmark_micro --codspeed --no-cov -v

  # Runs when suite = "core-suites" (or "all").
  # Three tests share one Db2 database instead of starting it three times:
  # read/write speed, tenant isolation, and load scaling.
  core-suites:
    name: "Speed, isolation & scaling tests"
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'core-suites')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      BENCH_OUT: benchmark_results
      LOCUST_OUT: locust_results
      LOCUST_SCALE_OUT: locust_scale_results

    steps:
      - name: Download repo code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python packages
        uses: ./.github/actions/setup-bench-python
        with:
          cache-key-suffix: core-suites
          extras: benchmark,langchain,openai-agents,mcp

      - name: Start Db2 database
        uses: ./.github/actions/setup-db2
        id: db2-setup
        with:
          compose-suffix: "-core"
          db2-image: ${{ env.DB2_IMAGE }}

      - name: Make result folders
        run: mkdir -p "$BENCH_OUT" "$LOCUST_OUT" "$LOCUST_SCALE_OUT"

      - name: Install and start Ollama
        uses: ./.github/actions/setup-ollama

      - name: Cache LongMemEval dataset
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/longmemeval
          key: longmemeval-dataset-v1

      - name: Pre-warm LongMemEval cache (first run only; no-op when cache hits)
        env:
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          python -c "
          from benchmarks.quality.longmemeval_adapter import load_longmemeval
          load_longmemeval('longmemeval_s')
          print('longmemeval_s cached.')
          "

      # Read/write speed
      - name: Measure function speed
        run: |
          pytest benchmarks/ -m benchmark_micro \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier0.json" \
            -v

      - name: Measure read/write speed
        run: |
          pytest benchmarks/ -m benchmark_pr \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_tier1.json" \
            -v

      - name: Quick quality suite check
        continue-on-error: true
        env:
          BENCH_EMBEDDING_PROVIDER: ollama
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          pytest benchmarks/quality/ -m benchmark_nightly \
            --no-cov \
            -v \
            --tb=short

      - name: Save speed test results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      # Tenant isolation
      - name: Quick concurrency smoke test
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/locustfile.py \
            --headless -u 50 -r 5 -t 3m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_OUT}/bm12_smoke" \
            SDK5User

      - name: Check tenant data isolation
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/isolation_user.py \
            --headless -u 200 -r 10 -t 5m \
            --csv "${LOCUST_OUT}/bm13_isolation" \
            IsolationUser SharedStoreIsolationUser

      - name: Save isolation test results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-isolation-report
          path: ${{ env.LOCUST_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      # Load scaling
      - name: Ramp up user load
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 200 -r 2 -t 5m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_SCALE_OUT}/bm14a_user_ramp" \
            UserRampUser

      - name: Sweep load across agents
        env:
          BENCH_N_AGENTS: "100"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 5m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_SCALE_OUT}/bm14b_agent_sweep" \
            AgentSweepUser

      - name: Mixed read-write traffic test
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 3m \
            --fail-ratio 0.01 \
            --csv "${LOCUST_SCALE_OUT}/bm14c_mixed_rw" \
            MixedReadWriteUser

      - name: Test tiny connection pool
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_SCALE_OUT}/bm15_pool1" \
            PoolSaturationUser

      - name: Test small connection pool
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_SCALE_OUT}/bm15_pool5" \
            PoolSaturationUser

      - name: Test medium connection pool
        env:
          DB2_POOL_SIZE: "10"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_SCALE_OUT}/bm15_pool10" \
            PoolSaturationUser

      - name: Test large connection pool
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${LOCUST_SCALE_OUT}/bm15_pool20" \
            PoolSaturationUser

      - name: Check pool fails gracefully
        continue-on-error: true
        env:
          DB2_POOL_SIZE: "1"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 10 -r 10 -t 1m \
            --csv "${LOCUST_SCALE_OUT}/bm15_oversaturate" \
            OverSaturationUser

      - name: Save scaling test results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: locust-scale-report
          path: ${{ env.LOCUST_SCALE_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Show database logs on failure
        if: failure()
        uses: ./.github/actions/print-db2-logs-on-failure
        with:
          container-id: ${{ steps.db2-setup.outputs.container-id }}

  # Runs when suite = "memory-quality" (or "all").
  # Checks how accurately and coherently the system recalls memories,
  # judged by an LLM, plus a moderate-scale read/write speed check.
  benchmark-nightly:
    name: "Check memory recall quality"
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'memory-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      BENCH_OUT: benchmark_nightly_results
      CORPUS_SIZE: ${{ inputs.corpus_size || '50k' }}

    steps:
      - name: Download repo code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python packages
        uses: ./.github/actions/setup-bench-python
        with:
          cache-key-suffix: benchmark-nightly
          extras: benchmark,langchain,openai-agents,mcp

      # Cache LongMemEval dataset (avoid re-downloading ~250 MB every run)
      - name: Cache LongMemEval dataset
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/longmemeval
          key: longmemeval-dataset-v1

      - name: Pre-warm LongMemEval cache (first run only; no-op when cache hits)
        env:
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          python -c "
          from benchmarks.quality.longmemeval_adapter import load_longmemeval
          load_longmemeval('longmemeval_s')
          print('longmemeval_s cached.')
          "

      - name: Install and start Ollama
        uses: ./.github/actions/setup-ollama

      - name: Start Db2 database
        uses: ./.github/actions/setup-db2
        id: db2-setup
        with:
          compose-suffix: "-nightly"
          db2-image: ${{ env.DB2_IMAGE }}

      - name: Make results folder
        run: mkdir -p "$BENCH_OUT"

      - name: Add test data rows
        if: inputs.scenario != 'ir-metrics'
        run: |
          python benchmarks/seed_corpus.py \
            --size "${CORPUS_SIZE}" \
            --seed 42 \
            --cardinality-category 5 \
            --cardinality-topic 20 \
            --provider ollama

      - name: Measure read/write speed
        if: inputs.scenario != 'ir-metrics'
        run: |
          pytest benchmarks/ -m "benchmark_micro or benchmark_pr" \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_benchmark.json" \
            -v

      - name: Mixed read-write traffic test
        if: inputs.scenario != 'ir-metrics'
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 15m \
            --fail-ratio 0.01 \
            --csv "${BENCH_OUT}/nightly_locust" \
            MixedReadWriteUser

      - name: Test small connection pool
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool5" \
            PoolSaturationUser

      - name: Test large connection pool
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool20" \
            PoolSaturationUser

      # BENCH_EMBEDDING_PROVIDER selects real Ollama embeddings here; set it
      # to "hashing" instead if Ollama isn't available (offline/degraded mode).
      - name: Measure memory recall accuracy
        id: ir_nightly
        if: inputs.scenario != 'locust'
        continue-on-error: true
        env:
          BENCH_EMBEDDING_PROVIDER: ollama
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          pytest benchmarks/quality/ -m benchmark_nightly \
            --no-cov \
            -v \
            --tb=short
          echo "ir_nightly_ran=true" >> "$GITHUB_OUTPUT"

      - name: Run backup recall check
        if: |
          inputs.scenario != 'locust' &&
          steps.ir_nightly.outputs.ir_nightly_ran != 'true'
        run: |
          echo "benchmark_nightly marker collected no tests — falling back to benchmark_micro."
          pytest benchmarks/quality/ -m benchmark_micro \
            --no-cov \
            -v \
            --tb=short

      # continue-on-error so a judge/Ollama failure doesn't stop the later
      # step from combining whatever partial results did come through.
      - name: Check task success rate
        id: agq2
        if: inputs.scenario != 'locust'
        continue-on-error: true
        run: |
          python -m benchmarks.agent_quality.tasks \
            --condition flat_context \
            --judge-model llama3.1:8b \
            --seed 42 \
            --output "${BENCH_OUT}/agq2.json"
          echo "agq2_ran=true" >> "$GITHUB_OUTPUT"

      - name: Check answers are grounded
        id: agq3
        if: inputs.scenario != 'locust' && inputs.scenario != 'ir-metrics'
        continue-on-error: true
        env:
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          python -m benchmarks.agent_quality.groundedness \
            --judge-model llama3.1:8b \
            --seed 42 \
            --n-per-category 4 \
            --output "${BENCH_OUT}/agq3.json" || true
          if [ -f "${BENCH_OUT}/agq3.json" ]; then
            echo "agq3_ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check answer coherence quality
        id: agq4
        if: inputs.scenario != 'locust' && inputs.scenario != 'ir-metrics'
        continue-on-error: true
        env:
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          python -m benchmarks.agent_quality.coherence \
            --judge-model llama3.1:8b \
            --seed 42 \
            --n-per-category 4 \
            --output "${BENCH_OUT}/agq4.json" || true
          if [ -f "${BENCH_OUT}/agq4.json" ]; then
            echo "agq4_ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Combine quality test results
        if: |
          inputs.scenario != 'locust' &&
          (steps.agq2.outputs.agq2_ran == 'true' ||
           steps.agq3.outputs.agq3_ran == 'true' ||
           steps.agq4.outputs.agq4_ran == 'true')
        run: |
          python benchmarks/agent_quality/run_agq.py \
            --agq2-json "${BENCH_OUT}/agq2.json" \
            --agq3-json "${BENCH_OUT}/agq3.json" \
            --agq4-json "${BENCH_OUT}/agq4.json" \
            --output    "${BENCH_OUT}/agq_results.json"

      - name: Save quality test results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-nightly-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Open bug report on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly benchmark regression — run ${{ github.run_number }}`,
              body: [
                '## Nightly benchmark regression detected',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                `**Commit:** ${{ github.sha }}`,
                `**Triggered by:** ${{ github.event_name }}`,
                '',
                'One or more nightly benchmark steps failed. Check the workflow run for details.',
                '',
                '**Labels:** benchmark, regression',
              ].join('\n'),
              labels: ['benchmark', 'regression'],
            });

      - name: Show database logs on failure
        if: failure()
        uses: ./.github/actions/print-db2-logs-on-failure
        with:
          container-id: ${{ steps.db2-setup.outputs.container-id }}

  # Runs when suite = "scale-performance" (or "all").
  # Same read/write speed test as above, but against 500,000 rows instead
  # of a small dataset, to catch problems that only show up at real scale.
  # If the runner runs low on memory/disk, switch runs-on to
  # ubuntu-latest-4-cores (16 GB RAM) — no other change needed.
  benchmark-scale:
    name: "Test speed at 500k rows"
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'scale-performance')
    runs-on: ubuntu-latest
    # 180 minutes — generous headroom since this is the slowest job here
    # (seeding + testing 500k rows, plus a 200-VU load test).
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      BENCH_OUT: benchmark_scale_results
      BENCH_TENANT_PREFIX: ${{ inputs.tenant_prefix || 'bm22-scale' }}

    steps:
      - name: Download repo code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python packages
        uses: ./.github/actions/setup-bench-python
        with:
          cache-key-suffix: benchmark-scale
          extras: benchmark,langchain,openai-agents,mcp

      - name: Install and start Ollama
        uses: ./.github/actions/setup-ollama

      # Cache LongMemEval dataset
      - name: Cache LongMemEval dataset
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/longmemeval
          key: longmemeval-dataset-v1

      - name: Pre-warm LongMemEval cache (first run only; no-op when cache hits)
        env:
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          python -c "
          from benchmarks.quality.longmemeval_adapter import load_longmemeval
          load_longmemeval('longmemeval_s')
          print('longmemeval_s cached.')
          "

      - name: Start Db2 database
        uses: ./.github/actions/setup-db2
        id: db2-setup
        with:
          compose-suffix: "-bench-scale"
          db2-image: ${{ env.DB2_IMAGE }}

      - name: Make results folder
        run: mkdir -p "$BENCH_OUT"

      - name: Add 500k test rows
        if: ${{ inputs.dry_run != true }}
        run: |
          python benchmarks/seed_corpus.py \
            --size 500k \
            --seed 99 \
            --cardinality-category 10 \
            --cardinality-topic 50 \
            --provider ollama

      - name: Measure speed at 500k rows
        if: ${{ inputs.dry_run != true }}
        run: |
          pytest benchmarks/ -m "benchmark_pr" \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_scale.json" \
            -v

      - name: Heavy mixed traffic test
        if: ${{ inputs.dry_run != true }}
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 200 -r 5 -t 15m \
            --fail-ratio 0.01 \
            --csv "${BENCH_OUT}/scale_locust" \
            UserRampUser MixedReadWriteUser

      - name: Measure recall at scale
        if: ${{ inputs.dry_run != true }}
        env:
          BENCH_EMBEDDING_PROVIDER: ollama
          LONGMEMEVAL_CACHE_DIR: /home/runner/.cache/longmemeval
        run: |
          pytest benchmarks/quality/ -m benchmark_micro \
            --no-cov \
            -v

      - name: Save scale test results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-scale-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Open bug report on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Tier 3 scale benchmark regression — run ${{ github.run_number }}`,
              body: [
                '## Tier 3 scale benchmark regression (containerized Db2)',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                `**Commit:** ${{ github.sha }}`,
                `**Triggered by:** ${{ github.event_name }}`,
                '',
                'One or more Tier 3 scale benchmark steps failed against the containerized Db2 instance.',
                '',
                '### Manual abort and cleanup',
                'If this run appears hung (> 3 hours), use the GitHub Actions UI to cancel it.',
                'The container is ephemeral — no external cleanup is required after the run ends.',
                '',
                '**Labels:** benchmark, regression, scale',
              ].join('\n'),
              labels: ['benchmark', 'regression'],
            });

      - name: Show database logs on failure
        if: failure()
        uses: ./.github/actions/print-db2-logs-on-failure
        with:
          container-id: ${{ steps.db2-setup.outputs.container-id }}
