name: Benchmark PR gate

# ────────────────────────────────────────────────────────────────────────────
# Two-tier benchmark gate on every push and pull request.
#
# Tier 0 (codspeed job) — every push, no Db2
#   CodSpeed Valgrind instruction counting on the micro-benchmarks.
#   Deterministic: immune to GHA's 2-3x wall-clock variance (Finding 5).
#   Gate: any instruction-count regression as reported by CodSpeed.
#   Budget: < 90 s.
#
# Tier 1 (benchmark-pr job) — pull_request only, with Db2
#   Round-trip-count assertions and correctness invariants against a live
#   Db2 LUW container.  The round-trip counter (benchmarks/common/counting.py)
#   is deterministic and runner-invariant — failures here mean the hot path
#   changed, not that the runner was slow.
#   Wall-clock results are published via github-action-benchmark to a
#   gh-pages trend chart; alert-threshold: 150% generates a PR comment but
#   does NOT fail the build.  fail-threshold: 300% hard-fails only if the
#   regression is egregious (> 3x wall-clock).
#   Budget: ≤ 25 min (Db2 startup ≤ 15 min + test run ≈ 10 min).
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
  pull_request:

# Workflow-level default: read-only.  The benchmark-pr job overrides to write
# for the gh-pages publish step.
permissions:
  contents: read

# Cancel a superseded run on the same branch/PR when a new push arrives so
# stale benchmark runs don't waste runner time.
concurrency:
  group: benchmark-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Tier 0 — CodSpeed instruction-count smoke test
  #
  # Runs on every push and PR.  No Db2 container — CPU-only, finishes in
  # < 90 s.  CodSpeed uses Valgrind to count CPU instructions, making the
  # result deterministic across any GHA runner.
  # ──────────────────────────────────────────────────────────────────────────
  codspeed:
    name: "Tier 0 — CodSpeed micro-benchmark smoke test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # id-token: write is required for CodSpeedHQ/action@v4's OpenID Connect
      # authentication with CodSpeed's API.  Without it the action falls back
      # to the CODSPEED_TOKEN secret; with it no secret is needed for public repos.
      id-token: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-codspeed-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-codspeed-3.11-

      # Install the benchmark extra (which includes pytest-codspeed) plus
      # all adapter extras so no micro-test is silently skipped.
      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ── 3. CodSpeed instrumented run ─────────────────────────────────────
      # CodSpeedHQ/action@v4 wraps the pytest invocation with the CodSpeed
      # runner (Valgrind-based instruction counting in 'walltime' mode, or
      # cycle-accurate counting in 'simulation' mode).
      #
      # mode: walltime — measures real elapsed time using perf/samply; works
      #   on standard GHA ubuntu-latest runners without special hardware.
      #   Use 'simulation' only on CodSpeed-managed runners.
      #
      # run: — the exact pytest invocation to execute inside the runner.
      #   -m benchmark_micro   selects only the Tier-0 CPU-only tests.
      #   --codspeed            activates the pytest-codspeed plugin, replacing
      #                         pytest-benchmark's wall-clock fixture with
      #                         CodSpeed's instruction-count fixture.
      #   -v                    verbose output for CI log readability.
      #
      # token: — optional when id-token: write is granted (OIDC auth);
      #   kept as a fallback for repos that have CODSPEED_TOKEN configured.
      - name: Run micro-benchmarks under CodSpeed instrumentation
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: pytest benchmarks/micro/ -m benchmark_micro --codspeed --no-cov -v
          token: ${{ secrets.CODSPEED_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Tier 1 — Round-trip-count + correctness gate against Db2
  #
  # Runs on pull_request only (no point gating pushes to main — ci.yml's
  # integration-test job covers the integration path already, and the weekly
  # benchmarks.yml covers the full suite).
  #
  # Hard-fails independently on:
  #   • Any benchmark_pr test failure (pytest exit code controls this —
  #     round-trip-count regressions and correctness-invariant violations
  #     both raise AssertionError inside the benchmark body, which pytest
  #     surfaces as non-zero exit).
  #
  # Wall-clock results are published to gh-pages via github-action-benchmark:
  #   alert-threshold: 150% → PR comment only (GHA runners vary 2-3x)
  #   fail-threshold:  300% → hard fail (extreme regression only)
  #
  # See Finding 5 in project-management/BENCHMARK_STRATEGY.md: wall-clock
  # alone must never be the sole PR gate.
  # ──────────────────────────────────────────────────────────────────────────
  benchmark-pr:
    name: "Tier 1 — PR benchmark gate (round-trip counts + Db2)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Wall-clock: Db2 startup ≤ 15 min + install ≈ 2 min + tests ≈ 10 min
    # = ≤ 27 min, fits within the 25-min added wall-clock budget when running
    # in parallel with Tier 0 (codspeed job is independent).
    if: github.event_name == 'pull_request'

    # contents: write is required by github-action-benchmark and
    # peaceiris/actions-gh-pages to push the trend data to gh-pages.
    permissions:
      contents: write

    env:
      # ── Db2 connection — identical to ci.yml integration-test job ─────────
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      # ── Benchmark output directory ────────────────────────────────────────
      BENCH_OUT: benchmark_pr_results

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-pr-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-pr-3.11-

      # Include all adapter extras so no benchmark_pr test is silently skipped.
      - name: Install package and benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ── 3. Db2 service container ──────────────────────────────────────────
      # The setup below is copied verbatim from ci.yml's integration-test job.
      # No new infrastructure: same image, same healthcheck, same DDL probe,
      # same transaction-log expansion.  See ci.yml for the full rationale
      # behind each step (especially the /var/custom hook and DDL probe).

      - name: Write /var/custom TESTDB-creation script
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-pr.yml
        run: |
          cat > /tmp/docker-compose.db2-pr.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        run: docker compose -f /tmp/docker-compose.db2-pr.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-pr.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready (vector index probe passed) after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for benchmark workloads
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-pr.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      # ── 4. Run Tier-1 benchmarks ──────────────────────────────────────────
      # Hard-fails on any pytest exit code != 0.
      # Round-trip-count regressions and correctness-invariant violations both
      # raise AssertionError in the benchmark body → pytest exits non-zero.
      # --no-cov: coverage slows the run and is not meaningful here.
      # --benchmark-json: produces the JSON consumed by github-action-benchmark.
      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Run Tier-1 benchmarks (benchmark_pr — requires Db2)
        run: |
          pytest benchmarks/ -m benchmark_pr \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output.json" \
            -v

      # ── 5. Publish wall-clock trend to gh-pages ───────────────────────────
      # github-action-benchmark reads the pytest-benchmark JSON and:
      #   • Pushes the new data point to the gh-pages trend store.
      #   • Posts a PR comment if the result exceeds alert-threshold (150%).
      #   • Fails the step (and therefore the job) if fail-threshold (300%)
      #     is exceeded — i.e. only for extreme wall-clock regressions.
      #
      # Rationale for the thresholds (Finding 5, BENCHMARK_STRATEGY.md):
      #   GHA shared runners vary 2-3x on identical work.  150% lets a 2x
      #   runner variance through as a comment only.  300% catches only
      #   regressions so severe that runner noise alone cannot explain them.
      #
      # This step runs with if: always() so trend data is published even when
      # the pytest step above hard-failed on a round-trip regression (so the
      # chart records the data point of the bad commit too).
      - name: Publish benchmark results to gh-pages trend
        if: always()
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: ${{ env.BENCH_OUT }}/output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # alert-threshold: comment on PR — does NOT fail the job.
          alert-threshold: "150%"
          # fail-threshold: hard fail — only for egregious wall-clock regression.
          fail-threshold: "300%"
          comment-on-alert: true
          alert-comment-cc-users: ""
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-pr

      # ── 6. Upload artifact ────────────────────────────────────────────────
      # Always upload so the JSON is downloadable even when the benchmark or
      # gh-pages publish step fails — post-mortem analysis without re-running.
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-pr-results
          path: ${{ env.BENCH_OUT }}/
          retention-days: 30
          if-no-files-found: warn

      # ── 7. Debug: Db2 container logs on failure ───────────────────────────
      # Only printed on failure — the full logs are several thousand lines
      # long and would pollute a successful run's output.
      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-pr.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi
