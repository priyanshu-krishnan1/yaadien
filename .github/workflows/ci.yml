name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint — ruff check
        run: ruff check .

      - name: Type-check — mypy
        run: mypy src

      - name: Unit tests — pytest (with coverage)
        # --cov / --cov-report / --cov-fail-under=85 are in pyproject.toml
        # addopts so the threshold is enforced here *and* on local runs.
        # The XML report is written to coverage.xml in the workspace root.
        run: pytest

      - name: Upload coverage report to Codecov
        # Upload once (on the 3.11 leg) to avoid triple-posting the same
        # data.  Requires CODECOV_TOKEN repo secret for private repos —
        # see https://docs.codecov.com/docs/adding-the-codecov-token.
        # On public repos the token is optional; the upload will succeed
        # without it but the report will be marked unverified.
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: "Integration tests (Db2 LUW)"
    runs-on: ubuntu-latest
    # Run independently of the unit matrix so Db2 boot time doesn't block fast
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-integration-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-integration-3.11-

      - name: Install package and all extras
        # The integration tests skip adapter subtests when the optional
        # framework packages are absent, so install everything to get full
        # coverage.  ibm_db ships its own bundled clidriver — no separate
        # Db2 client install is needed on the runner.
        run: pip install -e ".[dev,langchain,openai-agents,mcp]"

      - name: Start Db2 container
        # --privileged is required by the icr.io/db2_community/db2 image
        # (it needs IPC_OWNER to start the Db2 instance inside the container).
        # We manage the container ourselves (docker run) rather than using a
        # GitHub Actions service container so we can pass --privileged.
        run: |
          docker run -d \
            --name db2-dev \
            -e DB2INST1_PASSWORD=passw0rd \
            -e LICENSE=accept \
            -e DBNAME=TESTDB \
            -p 50000:50000 \
            --privileged \
            icr.io/db2_community/db2:12.1.5.0

      - name: Wait for Db2 to be ready
        # Db2 community container takes 3–5 minutes to initialise on first
        # start.  We poll with the same connectivity check documented in
        # INTEGRATION_TESTING.md (section "2 — Verify connectivity") rather
        # than using a fixed sleep.  The loop retries every 15 seconds for up
        # to 10 minutes (40 attempts) before failing the job.
        run: |
          echo "Waiting for Db2 to be ready (up to 10 min)…"
          for i in $(seq 1 40); do
            if docker exec db2-dev bash -c \
                "su - db2inst1 -c 'db2 connect to TESTDB'" \
                > /dev/null 2>&1; then
              echo "Db2 is ready (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/40 — not ready yet, sleeping 15s…"
            sleep 15
          done
          echo "ERROR: Db2 did not become ready within 10 minutes"
          docker logs db2-dev
          exit 1

      - name: Run integration tests
        run: pytest -m integration -v

  security:
    name: "Security scanning (pip-audit + bandit)"
    runs-on: ubuntu-latest
    # Run independently of the unit matrix so a security finding never delays
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-security-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-security-3.11-

      - name: Install package and dev dependencies
        # Full editable install so pip-audit sees the resolved dependency set
        # (including transitive deps) and bandit can import the package if needed.
        run: pip install -e ".[dev]"

      - name: Dependency audit — pip-audit
        # Fail on any vulnerability with a known CVE that has no available fix.
        # --fix is deliberately omitted (read-only audit in CI).
        # --ignore-vuln: add entries here with a DECISIONS.md reference when an
        # advisory is accepted (e.g. an unfixed vuln in a transitive dep with no
        # available upgrade path and a risk acceptance recorded in DECISIONS.md).
        # Example format: --ignore-vuln PYSEC-2024-XXXXX
        run: pip-audit --strict

      - name: Static security analysis — bandit
        # Scope: the three module groups VER-5 hand-verified for SQL injection
        # safety, plus the store facade.  All B608 (SQL string construction) and
        # B110 (try/except/pass) findings that VER-5 established as safe are
        # suppressed with per-site '# nosec B608' / '# nosec B110' comments on
        # the closing line of each f-string or except clause; the suppression
        # rationale is in DECISIONS.md PH-4.
        run: |
          bandit -r \
            src/agent_memory_sdk/db/ \
            src/agent_memory_sdk/repositories/ \
            src/agent_memory_sdk/store.py
