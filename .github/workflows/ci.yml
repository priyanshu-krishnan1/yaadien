name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint — ruff check
        run: ruff check .

      - name: Type-check — mypy
        run: mypy src

      - name: Unit tests — pytest (with coverage)
        # --cov / --cov-report / --cov-fail-under=85 are in pyproject.toml
        # addopts so the threshold is enforced here *and* on local runs.
        # The XML report is written to coverage.xml in the workspace root.
        run: pytest

      - name: Upload coverage report to Codecov
        # Upload once (on the 3.11 leg) to avoid triple-posting the same
        # data.  Requires CODECOV_TOKEN repo secret for private repos —
        # see https://docs.codecov.com/docs/adding-the-codecov-token.
        # On public repos the token is optional; the upload will succeed
        # without it but the report will be marked unverified.
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: "Integration tests (Db2 LUW)"
    runs-on: ubuntu-latest
    # Run independently of the unit matrix so Db2 boot time doesn't block fast
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-integration-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-integration-3.11-

      - name: Install package and all extras
        # The integration tests skip adapter subtests when the optional
        # framework packages are absent, so install everything to get full
        # coverage.  ibm_db ships its own bundled clidriver — no separate
        # Db2 client install is needed on the runner.
        run: pip install -e ".[dev,langchain,openai-agents,mcp]"

      - name: Write /var/custom TESTDB-creation script
        # Per IBM's Db2 container documentation, any script placed in
        # /var/custom is executed automatically once the base instance setup
        # completes — this is the container's own documented hook for
        # customizing database creation. Combined with the documented DBNAME
        # behavior ("leave empty if no database is needed" — omitting it
        # means the container creates no database at all), we use this hook
        # to create TESTDB ourselves with PAGESIZE 32768 from the start.
        #
        # This replaces the previous approach (let DBNAME auto-create a 4 KB
        # placeholder, then DROP/recreate it with the right page size), which
        # raced against Db2's own post-create background activity —
        # AUTOCONFIGURE, the configuration advisor, and Automated RUNSTATS
        # all run automatically on every CREATE DATABASE per IBM's official
        # CREATE DATABASE command reference — plus the healthcheck's own
        # periodic reconnects. FORCE APPLICATION ALL could clear connections
        # at one instant and still lose that race a moment later, which is
        # exactly SQL1035N ("database currently in use") on DROP DATABASE.
        # Never auto-creating the wrong-page-size placeholder removes the
        # whole class of race, rather than hardening the retry around it.
        #
        # The script is defensive about execution context (root vs.
        # db2inst1) since the container's own entrypoint internals for
        # /var/custom aren't published — it works either way.
        #
        # The heredoc body below inherits this run block's YAML indentation
        # on every line (a harmless, already-proven-safe pattern for the
        # docker-compose YAML heredoc further down, since YAML nesting is
        # relative) — but a shebang line specifically must start at column 0
        # for the kernel to honor it if /var/custom invokes the script by
        # direct execution rather than `bash script.sh`. The `sed` strips
        # that inherited indentation from every line so the shebang is
        # unconditionally valid regardless of invocation style.
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2.yml
        # Inline the compose file so no extra tracked file is needed.
        # Based on the same reference config as
        # github.com/GeetikaChughIBM/haystack-core-integrations
        # (integrations/ibm_db/docker-compose.yml), adapted to omit DBNAME
        # and mount the /var/custom script above instead of letting the
        # container auto-create a 4 KB placeholder database (see the
        # previous step's comment for why).
        #
        # ARCHIVE_LOGS=false prevents archive-logging setup from blocking startup.
        # shm_size: "1g" matches the reference; Db2 uses SYSV shared memory.
        run: |
          cat > /tmp/docker-compose.db2.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        # docker compose up --wait blocks until the healthcheck passes (i.e.
        # TESTDB — created by the mounted /var/custom script with the correct
        # 32 KB page size — is reachable) or the deadline is reached. The
        # healthcheck's own SQL1013N ("database alias not found") failures
        # while /var/custom is still running are expected and simply retried;
        # no separate wait step is needed for that. 300s start_period +
        # 30×30s retries = 15 min max.
        run: docker compose -f /tmp/docker-compose.db2.yml up -d --wait
        timeout-minutes: 15

      - name: Run integration tests
        # Override addopts coverage flags — the integration suite covers the live
        # DB path only (77 tests); the 85% threshold applies to the full unit suite
        # in the lint-typecheck-test job, not here.
        run: pytest -m integration -v --no-cov

  security:
    name: "Security scanning (pip-audit + bandit)"
    runs-on: ubuntu-latest
    # Run independently of the unit matrix so a security finding never delays
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-security-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-security-3.11-

      - name: Install package and dev dependencies
        # Full editable install so pip-audit sees the resolved dependency set
        # (including transitive deps) and bandit can import the package if needed.
        run: pip install -e ".[dev]"

      - name: Dependency audit — pip-audit
        # Upgrade setuptools to >=83.0.0 before auditing — the runner image ships
        # an older version with PYSEC-2026-3447.  setuptools is not a declared
        # dependency of this project (hatchling is the build backend); upgrading it
        # on the runner is safe and avoids a spurious CVE failure.
        # --ignore-vuln: add entries here with a DECISIONS.md reference when an
        # advisory is accepted (e.g. an unfixed vuln in a transitive dep with no
        # available upgrade path and a risk acceptance recorded in DECISIONS.md).
        run: |
          pip install --upgrade "setuptools>=83.0.0"
          pip-audit --strict

      - name: Static security analysis — bandit
        # Scope: the three module groups VER-5 hand-verified for SQL injection
        # safety, plus the store facade.  All B608 (SQL string construction) and
        # B110 (try/except/pass) findings that VER-5 established as safe are
        # suppressed with per-site '# nosec B608' / '# nosec B110' comments on
        # the closing line of each f-string or except clause; the suppression
        # rationale is in DECISIONS.md PH-4.
        run: |
          bandit -r \
            src/agent_memory_sdk/db/ \
            src/agent_memory_sdk/repositories/ \
            src/agent_memory_sdk/store.py
