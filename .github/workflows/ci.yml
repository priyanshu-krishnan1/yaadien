name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # Manual re-run trigger (e.g. re-checking the integration suite while
    # debugging a flaky Db2 container start, without pushing an empty commit).

# Default to read-only GITHUB_TOKEN permissions at the workflow level;
# individual jobs escalate only if they specifically need to (none currently
# do — codecov-action uploads via its own token, not the GITHUB_TOKEN).
permissions:
  contents: read

# Cancel a superseded run on the same branch/PR when a new commit is pushed,
# instead of letting each push run this ~15-minute pipeline to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6a463db41a5de1699b # v6.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install package and dev dependencies
        run: uv sync --locked --extra dev

      - name: Lint — ruff check
        run: ruff check .

      - name: Type-check — mypy
        run: mypy src

      - name: Unit tests — pytest (with coverage)
        # --cov / --cov-report / --cov-fail-under=85 are in pyproject.toml
        # addopts so the threshold is enforced here *and* on local runs.
        # The XML report is written to coverage.xml in the workspace root.
        run: pytest

      - name: Board — check BOARD.html is not stale
        # project-management/BOARD.html is generated from
        # project-management/board/{epics,stories}/*.json — catches a PR
        # that edited a shard file but forgot to run `make board` (or
        # edited the generated file directly instead of its source).
        # stdlib-only script, one leg is enough.
        if: matrix.python-version == '3.11'
        run: python project-management/board/build.py --check

      - name: Upload coverage to Codecov
        # Upload once (on the 3.11 leg) to avoid triple-posting the same
        # data.  Requires CODECOV_TOKEN repo secret — already added to
        # GitHub Secrets under the name CODECOV_TOKEN.
        # coverage.xml is produced by pytest --cov-report=xml (pyproject.toml addopts).
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

  integration-test:
    name: "Integration tests (Db2 LUW)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run independently of the unit matrix so Db2 boot time doesn't block fast
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.
    # 30 min covers the 15-min container-start budget below plus install +
    # test-run time, with headroom before GitHub's own runaway-job limits.

    env:
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python and dependencies
        uses: ./.github/actions/setup-bench-python
        with:
          cache-key-suffix: integration
          extras: langchain,openai-agents,mcp

      - name: Setup Db2 container
        uses: ./.github/actions/setup-db2
        id: db2-setup

      - name: Run integration tests
        # Override addopts coverage flags — the integration suite covers the live
        # DB path only (77 tests); the 85% threshold applies to the full unit suite
        # in the lint-typecheck-test job, not here.
        run: pytest -m integration -v --no-cov

  security:
    name: "Security scanning (pip-audit + bandit)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run independently of the unit matrix so a security finding never delays
    # lint/type-check/unit feedback.  Both jobs are required for PR merge.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6a463db41a5de1699b # v6.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install package and dev dependencies
        # Full editable install so pip-audit sees the resolved dependency set
        # (including transitive deps) and bandit can import the package if needed.
        run: uv sync --locked --extra dev

      - name: Dependency audit — pip-audit
        # --ignore-vuln: add entries here with a DECISIONS.md reference when an
        # advisory is accepted (e.g. an unfixed vuln in a transitive dep with no
        # available upgrade path and a risk acceptance recorded in DECISIONS.md).
        run: uv run pip-audit --strict

      - name: Static security analysis — bandit
        # Scope: the three module groups VER-5 hand-verified for SQL injection
        # safety, plus the store facade.  All B608 (SQL string construction) and
        # B110 (try/except/pass) findings that VER-5 established as safe are
        # suppressed with per-site '# nosec B608' / '# nosec B110' comments on
        # the closing line of each f-string or except clause; the suppression
        # rationale is in DECISIONS.md PH-4.
        run: |
          bandit -r \
            src/agent_memory_sdk/db/ \
            src/agent_memory_sdk/repositories/ \
            src/agent_memory_sdk/store.py
