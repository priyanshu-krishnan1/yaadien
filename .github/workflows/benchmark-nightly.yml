# ──────────────────────────────────────────────────────────────────────────────
# Nightly benchmark workflow — Tier 2 (EPIC-17, BM-21)
#
# Owned by: benchmarks team
# Epic:     EPIC-17 — Nightly Tier-2 benchmark pipeline
# Story:    BM-21   — Create benchmark-nightly.yml
#
# Purpose
# -------
# A dedicated nightly pipeline that runs the full suite of Tier-2 benchmark
# steps against a live Db2 instance seeded with a 50k-row corpus:
#
#   Step 4  Full pytest suite  — benchmark_micro + benchmark_pr
#   Step 5  Locust ramp        — BM-14: 50 VUs, 15 min, 70/30 read-heavy
#   Step 6  Pool saturation    — BM-15: quick 2-min pass at pool=5 and pool=20
#   Step 7  IR metrics         — BM-17: benchmark_nightly quality suite
#                                (falls back to benchmark_micro until BM-17 lands)
#
# This is intentionally a SEPARATE file from .github/workflows/benchmarks.yml
# (which runs weekly on Sundays at 04:00 UTC as Tier-0 + Tier-1). The nightly
# workflow owns the scheduled Tier-2 cadence; the weekly workflow continues
# to include a manual-dispatch-only Tier-2 step for convenience.
#
# Triggers
# --------
#   schedule          — daily at 03:00 UTC
#   workflow_dispatch — manual one-shot with optional input overrides
#
# Inputs (workflow_dispatch only)
# --------------------------------
#   corpus_size   "50k" (default) | "1k" | "500k"  — seed corpus size
#   scenario      "full" (default) | "locust" | "ir-metrics"
#                     full       — all steps
#                     locust     — skip IR-metrics step (step 7)
#                     ir-metrics — skip corpus seed, pytest suite, and Locust
#                                  steps (steps 3–6); run only IR metrics
#
# Concurrency
# -----------
# Scheduled nightly runs on the same ref can be superseded (cancel-in-progress
# true); manual dispatch runs are always intentional and are not cancelled.
# ──────────────────────────────────────────────────────────────────────────────

name: Benchmark Nightly

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      corpus_size:
        description: "Seed corpus size: 1k / 50k / 500k"
        required: false
        default: "50k"
      scenario:
        description: "Scenario filter: full / locust / ir-metrics"
        required: false
        default: "full"

# contents: write — gh-pages publish step + regression issue creation.
# issues: write   — opening regression issues on failure.
# Declared at workflow level as the maximum grant; the single job below
# echoes the same set so the effective permission is never accidentally wider.
permissions:
  contents: write
  issues: write

# Cancel in-progress scheduled runs when a new nightly fires on the same ref;
# keep workflow_dispatch runs alive — they are always deliberate one-off calls.
concurrency:
  group: benchmark-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  benchmark-nightly:
    name: "Nightly benchmark suite — Tier 2 (BM-21)"
    runs-on: ubuntu-latest
    # 2-hour budget covers: Db2 startup (≤ 15 min) + corpus seed (≤ 5 min)
    # + pytest suite (≤ 15 min) + Locust 15-min ramp + pool-sat sweep (4 min)
    # + IR metrics (≤ 10 min) + artifact upload / gh-pages publish.
    timeout-minutes: 120
    permissions:
      contents: write   # gh-pages publish
      issues: write     # regression issue creation

    env:
      # ── Db2 connection — identical to ci.yml and benchmarks.yml ─────────────
      DB2_DATABASE: TESTDB
      DB2_HOSTNAME: localhost
      DB2_PORT: "50000"
      DB2_UID: db2inst1
      DB2_PWD: passw0rd
      # ── Output directory (JSON + CSV artifacts) ──────────────────────────────
      BENCH_OUT: benchmark_nightly_results
      # ── Corpus size: prefer the manual input; fall back to "50k" for schedule ─
      CORPUS_SIZE: ${{ inputs.corpus_size || '50k' }}

    steps:
      # ──────────────────────────────────────────────────────────────────────────
      # 1. Checkout + Python setup + pip cache + install
      # ──────────────────────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-benchmark-nightly-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-benchmark-nightly-3.11-
            pip-benchmark-3.11-

      # Install all extras so:
      #   dev            — pytest, ruff, mypy
      #   benchmark      — pytest-benchmark, locust, psutil, pytest-memray
      #   langchain      — LangChain adapter (adapter-overhead benchmarks)
      #   openai-agents  — OpenAI Agents adapter
      #   mcp            — MCP adapter
      - name: Install package and all benchmark dependencies
        run: pip install -e ".[dev,benchmark,langchain,openai-agents,mcp]"

      # ──────────────────────────────────────────────────────────────────────────
      # 2. Db2 container setup
      #    Verbatim from ci.yml / benchmarks.yml:
      #      • /var/custom script creates TESTDB with PAGESIZE 32768
      #        (required for CREATE VECTOR INDEX)
      #      • docker-compose with healthcheck polling `db2 connect to TESTDB`
      #      • DDL readiness probe: CREATE VECTOR INDEX drains catalog agents
      #      • Transaction log expansion: 1504 MB total prevents SQL0964C
      #        under sustained Locust write load
      # ──────────────────────────────────────────────────────────────────────────

      - name: Write /var/custom TESTDB-creation script
        # Per IBM's Db2 container documentation, any script placed in
        # /var/custom is executed once base instance setup completes.
        # We omit DBNAME so the container creates no database automatically;
        # the /var/custom hook creates TESTDB with PAGESIZE 32768 instead.
        # The sed strip ensures the shebang lands at column 0 regardless of
        # this YAML block's indentation — required for direct execution.
        run: |
          mkdir -p /tmp/var-custom
          cat > /tmp/var-custom/01_create_testdb.sh << 'EOF'
          #!/bin/bash
          set -e
          if [ "$(id -un)" = "db2inst1" ]; then
            db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768
          else
            su - db2inst1 -c "db2 CREATE DATABASE TESTDB USING CODESET UTF-8 TERRITORY US PAGESIZE 32768"
          fi
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/var-custom/01_create_testdb.sh
          chmod +x /tmp/var-custom/01_create_testdb.sh

      - name: Write docker-compose.db2-nightly.yml
        # Matches the compose spec used in ci.yml and benchmarks.yml exactly.
        # Image: icr.io/db2_community/db2:12.1.5.0
        # ARCHIVE_LOGS=false: prevents archive-logging setup from blocking startup.
        # shm_size=1g:        Db2 uses SYSV shared memory; matches reference configs.
        # healthcheck:        polls `db2 connect to TESTDB` every 30s; up to
        #                     300s start_period + 30×30s retries = 15 min max.
        run: |
          cat > /tmp/docker-compose.db2-nightly.yml << 'EOF'
          services:
            db2:
              image: icr.io/db2_community/db2:12.1.5.0
              platform: linux/amd64
              privileged: true
              environment:
                LICENSE: accept
                DB2INST1_PASSWORD: passw0rd
                ARCHIVE_LOGS: "false"
              ports:
                - "50000:50000"
              shm_size: "1g"
              volumes:
                - /tmp/var-custom/01_create_testdb.sh:/var/custom/01_create_testdb.sh
              healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1"]
                interval: 30s
                timeout: 60s
                retries: 30
                start_period: 300s
          EOF

      - name: Start Db2 and wait for healthy
        # docker compose up --wait blocks until the healthcheck passes (i.e.
        # TESTDB is reachable) or the deadline is reached.
        # 300s start_period + 30×30s retries = 15 min max.
        run: docker compose -f /tmp/docker-compose.db2-nightly.yml up -d --wait
        timeout-minutes: 15

      - name: Wait for Db2 DDL readiness (catalog-agent drain)
        # docker compose --wait only verifies `db2 connect to TESTDB` succeeds.
        # It does NOT mean Db2's post-CREATE background agents (AUTOCONFIGURE,
        # Automated RUNSTATS, configuration advisor) have finished consuming
        # catalog-agent slots.  When those agents are running, DDL that needs
        # a catalog agent — such as CREATE VECTOR INDEX — raises SQL1476N.
        #
        # The probe uses CREATE VECTOR INDEX (not just CREATE TABLE) because
        # only vector-index DDL contends for catalog-agent slots.
        # Up to 20 × 15s = 300s max; non-fatal if the probe never confirms.
        run: |
          echo "Polling Db2 DDL readiness (CREATE VECTOR INDEX probe)..."
          for i in $(seq 1 20); do
            DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
            result=$(docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && \
               db2 'CREATE TABLE ddl_probe (id INT, v VECTOR(3) NOT NULL)' && \
               db2 'CREATE VECTOR INDEX ix_ddl_probe_v ON ddl_probe (v) WITH DISTANCE COSINE' && \
               db2 'DROP TABLE ddl_probe' && \
               db2 terminate" 2>&1 || true)
            if echo "$result" | grep -q "DB20000I" && ! echo "$result" | grep -qiE "SQL[0-9]+N|error"; then
              echo "Db2 DDL ready (vector index probe passed) after attempt $i."
              exit 0
            fi
            echo "Attempt $i: Catalog agents still settling. Waiting 15s..."
            docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
              "db2 connect to TESTDB && db2 'DROP TABLE ddl_probe' && db2 terminate" \
              >/dev/null 2>&1 || true
            sleep 15
          done
          echo "WARNING: Db2 DDL probe did not confirm readiness after 300s; proceeding anyway."
          exit 0

      - name: Expand Db2 transaction log for nightly workloads
        # LOGFILSIZ 4096 (16 MB/file) × (LOGPRIMARY 30 + LOGSECOND 64) = 1504 MB
        # total log space — prevents SQL0964C (log full) under the sustained
        # Locust write load of the 15-min ramp (step 5).
        # LOGFILSIZ requires a deactivate + activate cycle to take effect.
        # Wrapped in || true — any failure here is non-fatal.
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
          docker exec "${DB2_CONTAINER}" su - db2inst1 -c \
            "db2 'UPDATE DATABASE CONFIGURATION FOR TESTDB USING LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64' && \
             db2 deactivate db TESTDB && \
             db2 activate db TESTDB" >/dev/null 2>&1 || true

      # ──────────────────────────────────────────────────────────────────────────
      # 3. Seed the corpus
      #    Populates the Db2 instance with a deterministic corpus of CORPUS_SIZE
      #    rows so that all downstream benchmark steps operate on realistic data
      #    volumes.  Seeding 50k rows completes in < 5 min.
      #    Skipped when scenario == 'ir-metrics' (no Db2 needed for that path).
      # ──────────────────────────────────────────────────────────────────────────

      - name: Create benchmark output directory
        run: mkdir -p "$BENCH_OUT"

      - name: Seed corpus (${{ env.CORPUS_SIZE }} rows)
        # --seed 42             reproducible row content and vector values
        # --cardinality-category 5   five distinct category labels
        # --cardinality-topic 20     twenty distinct topic labels
        # Together these settings produce a realistic multi-category distribution
        # that exercises both equality-filter and range-scan code paths.
        if: inputs.scenario != 'ir-metrics'
        run: |
          python benchmarks/seed_corpus.py \
            --size "${CORPUS_SIZE}" \
            --seed 42 \
            --cardinality-category 5 \
            --cardinality-topic 20

      # ──────────────────────────────────────────────────────────────────────────
      # 4. Full pytest benchmark suite (Tier-0 + Tier-1)
      #    Runs benchmark_micro (CPU-only, no Db2) and benchmark_pr (Db2)
      #    together in one invocation, writing a single JSON for the summary step.
      #    Skipped when scenario == 'ir-metrics'.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Run Tier-0 + Tier-1 benchmark suite (benchmark_micro + benchmark_pr)
        if: inputs.scenario != 'ir-metrics'
        run: |
          pytest benchmarks/ -m "benchmark_micro or benchmark_pr" \
            --no-cov \
            --benchmark-json="${BENCH_OUT}/output_benchmark.json" \
            -v

      # ──────────────────────────────────────────────────────────────────────────
      # 5. Locust ramp — BM-14 MixedReadWriteUser
      #    50 VUs, 5 VU/s ramp, 15-minute duration, 70/30 read-heavy mix.
      #    DB2_POOL_SIZE=20 prevents ConnectionPoolExhausted at 50 VUs.
      #    --fail-ratio 0.01 → exit non-zero if > 1 % of requests fail.
      #    Skipped when scenario == 'ir-metrics'.
      # ──────────────────────────────────────────────────────────────────────────

      - name: "BM-14 Locust ramp — MixedReadWriteUser (50 VUs, 15 min, 70/30)"
        if: inputs.scenario != 'ir-metrics'
        env:
          BENCH_RW_RATIO: "70/30"
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/scalability_tasks.py \
            --headless -u 50 -r 5 -t 15m \
            --fail-ratio 0.01 \
            --csv "${BENCH_OUT}/nightly_locust" \
            MixedReadWriteUser

      # ──────────────────────────────────────────────────────────────────────────
      # 6. BM-15 pool-saturation quick pass
      #    Two-point sweep (pool=5, pool=20) at 50 VUs for 2 min each.
      #    Kept lean for the nightly budget — the full 4-point sweep
      #    (pool in {1, 5, 10, 20}) runs in the weekly benchmarks.yml job.
      #    Skipped when scenario == 'ir-metrics'.
      # ──────────────────────────────────────────────────────────────────────────

      - name: "BM-15 pool-saturation sweep — pool=5 (50 VUs, 2 min)"
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "5"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool5" \
            PoolSaturationUser

      - name: "BM-15 pool-saturation sweep — pool=20 (50 VUs, 2 min)"
        if: inputs.scenario != 'ir-metrics'
        env:
          DB2_POOL_SIZE: "20"
        run: |
          locust \
            -f benchmarks/load/pool_saturation_user.py \
            --headless -u 50 -r 5 -t 2m \
            --csv "${BENCH_OUT}/nightly_pool20" \
            PoolSaturationUser

      # ──────────────────────────────────────────────────────────────────────────
      # 7. Deterministic IR metrics — BM-17 (longmemeval_s)
      #
      #    Primary:  pytest benchmarks/quality/ -m benchmark_nightly
      #              Runs the real LongMemEval-S suite (BM-17) once that story
      #              is complete.
      #
      #    Fallback: if no benchmark_nightly tests exist yet (BM-17 is still
      #              "To Do"), pytest exits 5 (no tests collected).  In that
      #              case the fallback step runs the existing deterministic IR
      #              unit tests (marked benchmark_micro) as a proxy.
      #
      #    Both steps skipped when scenario == 'locust'.
      # ──────────────────────────────────────────────────────────────────────────

      - name: "BM-17 IR metrics — benchmark_nightly suite (LongMemEval-S)"
        id: ir_nightly
        if: inputs.scenario != 'locust'
        # Exit code 5 = "no tests collected" in pytest — treat as soft skip so
        # the fallback step below can run.  All other non-zero exits propagate
        # as a real failure.
        continue-on-error: true
        run: |
          pytest benchmarks/quality/ -m benchmark_nightly \
            --no-cov \
            -v \
            --tb=short
          echo "ir_nightly_ran=true" >> "$GITHUB_OUTPUT"

      - name: "BM-17 IR metrics — fallback to benchmark_micro (BM-17 not yet implemented)"
        # Runs only when the benchmark_nightly step was skipped or collected
        # zero tests (outcome == 'failure' with no output_benchmark_nightly).
        # Once BM-17 is implemented and the benchmark_nightly step collects
        # tests this fallback will be a no-op (ir_nightly_ran == 'true').
        if: |
          inputs.scenario != 'locust' &&
          steps.ir_nightly.outputs.ir_nightly_ran != 'true'
        run: |
          echo "benchmark_nightly marker collected no tests — falling back to benchmark_micro."
          pytest benchmarks/quality/ -m benchmark_micro \
            --no-cov \
            -v \
            --tb=short

      # ──────────────────────────────────────────────────────────────────────────
      # 8. Generate GitHub Job Summary
      #    Appends a Markdown table of benchmark results to the run's step
      #    summary so results are visible on the Actions run page without
      #    downloading the artifact.
      #    if: always() — runs even when earlier steps failed so partial data
      #    is always surfaced.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Generate benchmark Job Summary
        if: always()
        run: |
          BENCH_JSON="${BENCH_OUT}/output_benchmark.json"
          if [ -f "$BENCH_JSON" ]; then
            python scripts/generate_benchmark_summary.py "$BENCH_JSON" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Nightly Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> No benchmark JSON found — the pytest step may have been skipped or failed." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # ──────────────────────────────────────────────────────────────────────────
      # 9. Upload artifact (JSON + CSV)
      #    Retains the benchmark JSON and all Locust CSV files for 30 days.
      #    if: always() — partial results are always saved, even on step failure.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: benchmark-nightly-report
          path: ${{ env.BENCH_OUT }}/
          retention-days: 30
          if-no-files-found: warn

      # ──────────────────────────────────────────────────────────────────────────
      # 10. Publish to gh-pages
      #     Writes the nightly output under benchmarks/nightly/<run_number>/
      #     on the gh-pages branch so every run is permanently accessible at:
      #       https://<owner>.github.io/yaadien/benchmarks/nightly/<run_number>/
      #     keep_files: true preserves all existing benchmark subdirectories.
      #     if: always() — partial results are always published.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Publish nightly results to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BENCH_OUT }}
          destination_dir: benchmarks/nightly/${{ github.run_number }}
          keep_files: true
          commit_message: "benchmarks(nightly): run ${{ github.run_number }} (${{ github.sha }})"

      # ──────────────────────────────────────────────────────────────────────────
      # 11. Open a regression issue on any test failure
      #     Creates a GitHub issue labelled 'benchmark' and 'regression' so the
      #     oncall is notified even without email/Slack notifications configured.
      #     if: failure() — only fires when at least one step has failed.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Open regression issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly benchmark regression — run ${{ github.run_number }}`,
              body: [
                '## Nightly benchmark regression detected',
                '',
                `**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                `**Commit:** ${{ github.sha }}`,
                `**Triggered by:** ${{ github.event_name }}`,
                '',
                'One or more nightly benchmark steps failed. Check the workflow run for details.',
                '',
                '**Labels:** benchmark, regression',
              ].join('\n'),
              labels: ['benchmark', 'regression'],
            });

      # ──────────────────────────────────────────────────────────────────────────
      # 12. Debug: print Db2 container logs on failure
      #     Identical to benchmarks.yml — dumps the last 100 lines of the Db2
      #     container log so Db2-side errors (SQL codes, crash traces) are
      #     visible directly on the Actions run page without extra tooling.
      #     if: failure() — only runs when a previous step has failed.
      # ──────────────────────────────────────────────────────────────────────────

      - name: Print Db2 container logs (last 100 lines) on failure
        if: failure()
        run: |
          DB2_CONTAINER=$(docker compose -f /tmp/docker-compose.db2-nightly.yml ps -q db2 2>/dev/null || true)
          if [ -n "${DB2_CONTAINER}" ]; then
            echo "=== Last 100 lines of Db2 container logs ==="
            docker logs --tail 100 "${DB2_CONTAINER}" 2>&1 || true
          else
            echo "Could not resolve Db2 container ID — container may not have started."
          fi
