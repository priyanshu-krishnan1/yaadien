 consolidated.** 5 jobs upload 5 differently-shaped artifacts (pytest-benchmark JSON, Locust CSV, ad-hoc JSON) and 3 of them (`benchmark`, `benchmark-nightly`, `benchmark-scale`) independently call `peaceiris/actions-gh-pages` in parallel — a real concurrent-push race on the same branch, currently un-guarded by any `concurrency:` block. The terminal `consolidated-report` job then re-downloads all 5 artifacts and hand-parses each format with bespoke bash/grep to fake a unified view; it does not actually unify the publish step, so gh-pages ends up with N independently-written report trees instead of one.\n5. **No selective execution.** Every `workflow_dispatch` run executes all 7 jobs — Tier 0 through Tier 3 plus both Locust suites — regardless of what's actually being tested, so a developer who only wants to re-check the isolation gate still pays the full multi-hour worst case.\n6. **The `db2-ready` gate is a fast-fail image-pull check, not a resource-sharing mechanism** (GHA cannot share a running container across jobs on different runners — this is documented correctly in the file's own header comment) — worth keeping for fail-fast behavior, but should be relabeled/scoped honestly rather than implying it saves downstream boot time.\n\nRelationship to other epics: EPIC-17 designed the four-tier structure this file implements; that tiering is sound and out of scope here — this epic is purely about internal duplication, Db2 sourcing, and reporting architecture within the already-tiered file. EPIC-22/WF-1 and WF-3 (uncommitted at audit time) describe a *pre-consolidation* state — a standalone `benchmarks.yml` colliding on schedule with a standalone `benchmark-scale.yml` — that no longer matches the repo (both are now one file, per commit 73c27b4's own message: 'consolidated benchmarks workflow'). Whoever picks up EPIC-22 should re-verify WF-1/WF-3 against current `benchmarks.yml` before starting; they may already be resolved or need re-scoping to reference this epic's output instead.\n\nDesign principles applied throughout (standard GHA best practice, verified against this repo's constraints): DRY via composite actions shared across `ci.yml` and `benchmarks.yml`; prefer GHA-native `services:` health-checking over hand-rolled polling where the Db2 image's health-check semantics allow it; one writer to any shared external resource (gh-pages) to eliminate races; SHA-pinned actions (already good practice here — preserve it); `concurrency:` groups on any job that mutates shared state; selective execution via `workflow_dispatch` inputs so cost scales with what's actually being tested, not with the size of the suite catalog.",

      "id": "EPIC-25",
      "title": "Long-term Db2 coupling & flexibility hardening — dialect seam, embedding versioning, distributed-safe consolidation",
      "description": "Audit (2026-08-08) of the memory core's long-term evolvability (`src/agent_memory_sdk/repositories/base.py`, `db/connection.py`, `db/migrate.py`), done through the lens of how OpenAI Agents SDK Sessions, Google Vertex AI Memory Bank, Anthropic's Claude Agent SDK Memory tool, and the closest architectural peer (Oracle AI Agent Memory) each trade storage portability against governance depth. The full market comparison already lives in `project-management/ai-agent-platform-competitive-analysis.md`; this epic captures the resulting engineering action items rather than repeating that analysis.\n\nCore finding: `BaseRepository` (base.py, 2028 lines) is a Db2 repository pattern, not a storage-agnostic one — Db2 SQL dialect and `ibm_db` driver quirks/workarounds are hardcoded directly inside the shared base class instead of isolated behind a seam. This is not itself wrong — Oracle AI Agent Memory made the same converged-substrate trade, and SQL-enforced scoping/governance is genuinely hard to get from a generic storage interface. But several of the workarounds inside `base.py` are Db2-*version*-specific, not Db2-*family*-specific, and none of them currently have a mechanism to detect \"this Db2 fixpack fixed the underlying issue, retire the workaround\":\n\n- Vector param binding unsupported (`SQL0901N`) → vectors inlined as SQL string literals via `CAST('{vec}' AS VECTOR(...))` (base.py ~lines 46-60, 1002, 1313, 1776, 1794).\n- `JSON_VALUE(col,path) = ?` segfaults the ibm_db C extension → all metadata-filter values inlined as escaped literals instead of bound params (base.py lines 291-343) — the escaping/coercion function is now a safety-critical component, not just a convenience.\n- `VECTOR_SERIALIZE()` and `VECTOR_DISTANCE()` can't combine in one statement → two-step rank-then-fetch query (base.py ~1758-1812).\n- Zero-vector rows cause `SQL0801N` (division by zero) in `VECTOR_DISTANCE` → filtered out of `ORDER BY` explicitly (base.py ~1769-1776).\n- Partial/filtered indexes unsupported (`SQL0104N`) → the `WHERE expires_at IS NOT NULL` predicate was dropped from all 5 TTL indexes, eroding index selectivity as tables grow instead of failing loudly.\n\nThis epic also converts three risk-register items (`project-management/design/11-risk-register.md`) into tracked work instead of leaving them as prose: RISK-1 (in-process-only consolidation throttle counter — incorrect under >1 replica), RISK-2 (embedding dimension baked into DDL at migration time — a provider/model switch is currently a breaking migration with no drift detection), and RISK-4/RISK-6 (hybrid-search Python-side ranking cap, and `ibm_db` clidriver install friction) — the latter two are scoped as \"watch/instrument\" items, not redesigns, per the explicit decision not to speculatively over-engineer a multi-backend abstraction before there's data showing it's needed.\n\nRelationship to other epics: distinct from EPIC-24 (CI/benchmark workflow DRY-ing) — this epic is about the memory core's own long-term evolvability, not its test infrastructure. No file overlap. FLEX-4 (hybrid-search instrumentation) pairs naturally with EPIC-24/CIB-3's planned 500k-row container-Db2 spike — both touch corpus-scale behavior and could share findings.",

      "id": "EPIC-26",
      "title": "Benchmark workflow wall-clock reduction — kill dead sequencing, cut setup overhead, warm the Db2 boot",
      "description": "Research note (2026-08-08, full write-up in `project-management/CI_BENCHMARK_PERFORMANCE.md`) on `.github/workflows/benchmarks.yml` as it stands after EPIC-24/CIB-1..7. That epic optimised for correctness and consolidation — DRY composite actions, container-only Db2, single-writer gh-pages, a `suite:` selector, a concurrency guard. All of that landed and none of it is being undone here. What it did not do is reduce wall clock: a `suite: all` dispatch still takes roughly 2–2.5 hours, and roughly 25 minutes per Db2 job of that is fixed setup overhead that buys nothing.\n\nCritical path today is `db2-ready` → `max(benchmark-nightly, benchmark-scale)` → `consolidated-report`. Per-job overhead before a single benchmark executes:\n\n| Phase | Cost | Paid by |\n|---|---|---|\n| `db2-ready` docker pull (~3 GB from icr.io) | 4–6 min | blocks 5 jobs |\n| `pip install -e \".[dev,benchmark,...]\"` | 4–8 min | 6 jobs |\n| `setup-db2` — pull the *same* image again | 4–6 min | 5 jobs |\n| `compose up --wait` (`start_period: 300s`, `interval: 30s`) | 5–10 min | 5 jobs |\n| DDL readiness poll (flat 15 s sleep × up to 20) | 0–5 min | 5 jobs |\n\nFindings, highest ROI first:\n\n**A. `db2-ready` warms nothing.** Its stated purpose is to \"confirm the image is accessible so that all downstream jobs can trust the image cache is warm on the runner pool.\" That premise is false on GitHub-hosted runners: every job gets a fresh VM with an empty Docker image store, so nothing pulled in `db2-ready` is visible to `benchmark`, `locust-isolation`, `locust-scale`, `benchmark-nightly`, or `benchmark-scale` — each re-pulls the full image inside `setup-db2` anyway. Meanwhile all five sit behind `needs: [db2-ready]`, so the pull is added to the critical path *and* duplicated. Note this contradicts EPIC-24 finding 6, which characterised the gate as a \"fast-fail image-pull check\" worth keeping; the fail-fast value is real but is not worth 4–6 min of serial latency on five jobs, and `setup-db2` already fails loudly on a bad image. The job's only genuine output is a constant string.\n\n**B. Db2 boot is over-conservative.** `interval: 30s` means that once Db2 is ready you wait up to another 30 s to notice. Docker marks a container healthy on the first passing probe *including during `start_period`*, and probe failures during `start_period` don't count against `retries` — so a short interval paired with a long start period is strictly free. The DDL probe on top of it sleeps a flat 15 s and re-runs a full connect → CREATE TABLE → CREATE VECTOR INDEX → DROP cycle each attempt.\n\n**C. `torch` installs in six jobs, three of which never use it.** `sentence-transformers>=5.6.1` in the `benchmark` extra pulls torch — a 527 MB manylinux x86_64 wheel, confirmed in `uv.lock`, ~2.5 GB unpacked. Every job requests `extras: benchmark,langchain,openai-agents,mcp`, including both Locust jobs and `consolidated-report`, which only reads JSON and writes HTML. The `actions/cache` on `~/.cache/pip` avoids the download but not the unpack. Compounding this: the repo commits a 1.6 MB `uv.lock` but CI installs with pip, keyed on `hashFiles('pyproject.toml')` with a loose `restore-keys` fallback that can silently restore a stale cache and misses transitive drift.\n\n**D. `locust-scale` runs eight load steps strictly serially** — 22 minutes of pure load time on one runner, plus per-step ramp-up, on top of one Db2 boot.\n\n**E. The 500k seed corpus is regenerated row-by-row every scale run.** Per the EPIC-25 audit, vectors cannot be parameter-bound on this Db2 version and are inlined as `CAST('{vec}' AS VECTOR(...))` literals, so every row is a distinct, unprepared, fully-logged statement. This is also the reason the `LOGFILSIZ 4096 LOGPRIMARY 30 LOGSECOND 64` expansion step exists.\n\n**F. CIB-2's rejection of a custom Db2 image is worth reopening.** CIB-2 correctly identified why `jobs.<job>.services:` is blocked (GHA starts service containers before any step runs, so the host path bind-mounted to `/var/custom/01_create_testdb.sh` cannot be populated in time) and rejected a pre-baked image on maintenance/drift grounds. That was a reasonable call when the only benefit was unblocking `services:`. It now solves five things at once: removes the bind-mount, bakes TESTDB so the DDL poll disappears entirely, bakes the log config, pulls from GHCR in the same datacenter as the runner rather than from icr.io, and optionally carries the seeded corpus from (E).\n\nTwo items are genuine tradeoffs rather than clear wins and are gated behind spikes: the GHCR image (F) introduces a maintained artifact someone has to own, and matrixing the Locust sweeps (D) would inject inter-runner variance into BM-15's pool-size comparison — the exact axis being measured.\n\n**Scope boundary:** this epic is about wall clock and CI cost only. The four-tier structure (EPIC-17), the consolidation and reporting architecture (EPIC-24), and the Db2 dialect seam (EPIC-25) are all out of scope. No benchmark's measurement duration is reduced for speed — `benchmark-nightly`'s 15-minute Locust ramp and the AGQ judge steps are intended measurement time and stay as they are.\n\n**Caveat carried from the research note:** all timings are estimates from reading the workflow, not from measured run data. CIW-1 pulls real step durations first and re-ranks everything downstream; the Phase-1 stories are worth doing regardless because they're cheap and their reasoning doesn't depend on the estimates.\n\nTarget: `suite: all` critical path from ~2–2.5 h to ~50–70 min.",
      "comments": []
    }

      "description": "Add an optional `hybrid: bool = False` parameter to `search()` (and `_search_via_chunks()`). When enabled, compute a keyword-overlap score per candidate row (token-set overlap against the query string, computed in Python over the same candidate set already fetched — no new query) alongside the existing `VECTOR_DISTANCE` ranking, then fuse the two ranked lists via Reciprocal Rank Fusion (RRF: score = sum(1/(k+rank)) across both rankings, k=60 as the standard RRF default) into the final result order, rather than a hand-tuned weighted average.\n\nDo NOT depend on Db2's Text Search Extender (`CONTAINS`/`SCORE`/`CONTAINS_ANY`/`CONTAINS_ALL`) for this. The 2026-07-31 EPIC-2 research entry already flagged that current-version (12.1) documentation for that extender couldn't be confidently confirmed at the time; a fresh check for this epic still couldn't confirm whether it ships enabled-by-default versus requiring separate DBA-run enablement (IBM's own 'How to enable TEXT SEARCH for a DB2 database' support article describes it as an installable extender, historically opt-in, not a core SQL feature). A Python-side fusion keeps this zero-mandatory-infrastructure, matching the Step 0 principle, and is directly comparable in spirit to how both Oracle and Mem0 describe 'hybrid = semantic + keyword in the same search flow' without requiring callers to provision a separate search engine.\n\nInspired by: Oracle AI Agent Memory 26.6's newly-GA hybrid search ('combining semantic and keyword retrieval in the same search flow' per its official 26.6 changelog) and Mem0/Zep's longstanding hybrid-search feature-matrix entries in ai-agent-platform-competitive-analysis.md.\n\nDb2 feasibility: fully feasible with no new infrastructure — pure Python scoring over the existing candidate set, fused before the existing `top_k` slice. If Db2 Text Search Extender availability is later confirmed on a real 12.1+ instance, note that as a documented future upgrade path (real `CONTAINS`/`SCORE` instead of the Python approximation) rather than blocking this story on it.",

      "description": "In `.github/actions/setup-db2/action.yml` the compose healthcheck is:\n\n```yaml\nhealthcheck:\n  test: [\"CMD-SHELL\", \"su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1\"]\n  interval: 30s\n  timeout: 60s\n  retries: 30\n  start_period: 300s\n```\n\nTwo separate sources of idle time:\n\n1. `interval: 30s` — once Db2 *is* ready, `docker compose up --wait` waits up to another 30 s before the next probe notices. Docker marks a container healthy the moment any probe passes, **including during `start_period`**, and probe failures during `start_period` do not count against `retries`. So a short interval paired with a long start period costs nothing and loses no tolerance — it only makes detection finer-grained. `start_period: 300s` should stay exactly as it is.\n\n2. The DDL readiness loop that follows sleeps a flat 15 s between attempts and re-runs a full connect → `CREATE TABLE ddl_probe` → `CREATE VECTOR INDEX` → `DROP TABLE` → `terminate` cycle each time. Catalog-agent drain is usually done well before the first 15 s elapses, so most runs pay a full extra interval for nothing.\n\nWork:\n\n- Healthcheck → `interval: 5s`, `timeout: 30s`, `retries: 120`, `start_period: 300s` (unchanged). Total tolerance is preserved: 120 × 5 s = 600 s of post-start-period grace, same order as the current 30 × 30 s.\n- DDL probe → replace `sleep 15` with backoff starting at 2 s and capping at 15 s (2, 4, 8, 15, 15, ...). Keep the total budget at ~300 s and keep the existing \"proceed anyway\" fallback and its warning.\n- Leave the in-loop container-ID re-resolution and the `DROP TABLE` cleanup between attempts alone — both are deliberate and correct.\n\nThis is a prerequisite for CIW-13: at today's ~12 min boot a Locust matrix is roughly break-even, because each new leg pays a full boot. At a 4-minute boot it becomes a clear win.\n\nDone when: a `suite: locust-isolation` dispatch shows a measurably shorter `setup-db2` step with no increase in flakiness across at least 3 runs.",

alled. If uv breaks it, keep pip for that one package via `[tool.uv]` config rather than abandoning the migration.\n\nDone when: all benchmark jobs install via uv, the cache key derives from `uv.lock`, and `ibm_db` connects to Db2 in CI.",

      "description": "`locust-scale` runs eight load steps strictly serially: BM-14a (5 m) + BM-14b (5 m) + BM-14c (3 m) + BM-15 pool=1/5/10/20 (2 m each) + oversaturation (1 m) = 22 minutes of pure load time on one runner, plus per-step ramp-up, on top of one Db2 boot. `benchmark-nightly` runs a similar serial block.\n\nA `strategy: matrix` is the obvious fix, and for BM-14a/b/c it is straightforwardly safe — they are independent scenarios, reported separately, never compared to each other.\n\nBM-15 is different. Its four pool sizes are a *comparison*: the whole point is how latency and error rate move as `DB2_POOL_SIZE` goes 1 → 5 → 10 → 20. That comparison is only meaningful if all four ran on comparable hardware. GitHub-hosted runners vary between VMs — different physical hosts, different noisy neighbours — so a matrix would inject inter-runner variance directly into the measured axis. The variance could plausibly exceed the effect being measured, which would make the benchmark actively misleading rather than merely noisier.\n\nWork:\n\n- Run the identical BM-15 pool=5 configuration on 5+ separate runner VMs and compute the spread in p50/p95 latency and throughput.\n- Compare that spread against the *effect size* between pool=1 and pool=20 on a single runner.\n- If inter-runner spread is small relative to the pool-size effect, matrixing BM-15 is safe. If it's comparable or larger, BM-15's sweeps must stay co-located and only BM-14 gets split.\n- Separately confirm the Db2 boot cost after CIW-3 (and CIW-9 if it landed): each matrix leg pays a full boot, so at a 12-minute boot a 4-way split of an 8-minute block is a net loss. Establish the break-even.\n- Note that splitting *does* improve isolation between scenarios — BM-14b's 100-agent sweep currently shares a runner and a Db2 instance with the pool-saturation tests. Whether that's contaminating current results is worth checking while the harness is instrumented.\n\nDeliverable: a comment recording the variance numbers and the go/no-go decision for CIW-13.",

          "date": "2026-08-08",
          "text": "Spike preparation complete. Variance measurement workflow created at .github/workflows/runner-variance-check.yml. To run: Actions → 'Runner variance check (CIW-12)' → Run workflow with repetitions=5. Run once with pool_size=5 to measure spread; run again with pool_size=1 and pool_size=20 on a single runner to get the effect size baseline. Decision rule: if spread (max-min/median) < 20% of the pool=1 vs pool=20 effect size → matrixing BM-15 is safe → proceed to CIW-13 with full scope. If spread >= 20% → keep BM-15 co-located, only matrix BM-14a/b/c → proceed to CIW-13 with reduced scope. Note: run this measurement AFTER CIW-3 (healthcheck tightened) to get representative boot times for the break-even calculation."

      "description": "**Do not start until CIW-12 reports.** The default expectation from the research note is: split BM-14a/b/c into a matrix, keep BM-15's four pool sweeps co-located on one runner for comparability. CIW-12's data may change that in either direction.\n\nWork:\n\n- Convert the cleared steps to a `strategy: matrix` with `fail-fast: false` — one scenario failing should not cancel the others, since each produces an independent artifact.\n- Give each leg a distinct `compose-suffix` for `setup-db2` and a distinct `LOCUST_OUT` and artifact name, so the parallel legs don't collide on the compose file path or on artifact upload.\n- Update `consolidated-report`'s `needs:` and its artifact-download steps to handle N artifacts from a matrix rather than one from a single job. This is the part most likely to break quietly — verify the consolidated report actually contains every leg's results, not just the last one downloaded.\n- Update `scripts/locust_csv_to_jsonl.py` invocations if the output layout changes.\n- Keep the `suite:` selector working — a matrix leg still needs to respect `inputs.suite`.\n\nRunner cost: each leg pays its own Db2 boot. Public repositories get unmetered standard GitHub-hosted runners, so this is free in billing terms, but it does consume concurrency slots — check the org's concurrent-job limit before fanning out wide, since queueing behind your own matrix would defeat the purpose.\n\nDone when: `suite: locust-scale` wall clock is measurably shorter, every scenario's results appear in the consolidated report, and results are consistent with pre-matrix runs.",

</script>

<div class="header">
  <div class="header-logo">AM</div>
  <div>
    <div class="header-title">agent-memory-sdk</div>
  </div>
  <div class="header-sub">Local Project Board &nbsp;·&nbsp; IBM Db2 LUW + Python</div>
</div>

<div class="stats-row">
  <div class="stat-pill"><span class="stat-dot dot-todo"></span><span id="cntTodo">0</span>&nbsp;To Do</div>
  <div class="stat-pill"><span class="stat-dot dot-wip"></span><span id="cntWip">0</span>&nbsp;In Progress</div>
  <div class="stat-pill"><span class="stat-dot dot-done"></span><span id="cntDone">0</span>&nbsp;Done</div>
  <div class="lane-toolbar">
    <button id="btnExpandAll" type="button">Expand all</button>
    <button id="btnCollapseAll" type="button">Collapse all</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="Filter by id or title…">
  </div>
</div>

<div class="lanes" id="lanes"></div>

<!-- Detail modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="epic-tag story-tag" id="mTag">STORY</span>
      <div class="modal-titles">
        <div class="modal-id" id="mId"></div>
        <div class="modal-title" id="mTitle"></div>
      </div>
      <button class="modal-close" id="btnClose">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="section-label">Status &amp; meta</div>
      <div class="meta-row">
        <div class="meta-item"><span class="meta-key">Status</span><span id="mStatus" class="meta-val"></span></div>
        <div class="meta-item"><span class="meta-key">Type</span><span class="meta-val">Story</span></div>
        <div class="meta-item"><span class="meta-key">Epic</span><span class="meta-val" id="mEpic"></span></div>
      </div>
      <div class="section-label">Description</div>
      <div class="description-box" id="mDesc"></div>
      <div class="section-label">Comments</div>
      <div id="mComments" class="comments-list"></div>
      <div class="section-label" style="margin-top:12px">Add comment</div>
      <div class="add-comment-area">
        <textarea id="commentInput" placeholder="Enter comment text…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnStart">▶ Start</button>
      <button class="btn btn-primary"   id="btnDone">✓ Done</button>
      <button class="btn btn-secondary" id="btnBack">↩ Back</button>
      <button class="btn btn-secondary" id="btnAddComment">+ Comment</button>
      <button class="btn btn-danger"    id="btnReset">Reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer>Made with IBM Bob</footer>

<script>
// ── Load data from the embedded JSON block ──────────────────────────────────
const raw = document.getElementById('board-data').textContent;
let data  = JSON.parse(raw);

let activeId = null;

// ── Helpers ─────────────────────────────────────────────────────────────────
const COL_KEY = { 'To Do': 'todo', 'In Progress': 'wip', 'Done': 'done' };
const LABEL   = { todo: 'To Do', wip: 'In Progress', done: 'Done' };
const SC      = { 'To Do': 's-todo', 'In Progress': 's-wip', 'Done': 's-done' };

// Cycles indefinitely so any number of epics gets a distinct, readable color —
// the old scheme hardcoded CSS classes for epic-1/2/3 only, so EPIC-4 and
// EPIC-5 badges silently rendered colorless. This scales without edits.
const EPIC_PALETTE = ['#7c5cd8', '#0d9488', '#c2410c', '#be123c', '#0369a1', '#4d7c0f', '#a16207', '#7c2d92'];

function getStory(id) { return data.stories.find(s => s.id === id); }
function getEpic(id) { return data.epics.find(e => e.id === id); }
function epicColor(epicId) {
  const idx = data.epics.findIndex(e => e.id === epicId);
  return EPIC_PALETTE[(idx >= 0 ? idx : 0) % EPIC_PALETTE.length];
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
// Older story comments were appended as plain strings instead of
// {date, text} objects (a pre-existing data bug from an earlier session) —
// render either shape rather than showing "undefined".
function normalizeComment(c) {
  if (typeof c === 'string') return { date: '', text: c };
  // Some comments were written with a "body" key instead of "text"
  if (c.text === undefined && c.body !== undefined) return { date: c.date || '', text: c.body };
  return c;
}

// ── Collapse state — persisted in localStorage, keyed per epic ───────────────
// A lane with no stored preference defaults to collapsed once every story in
// it is Done, and expanded otherwise, so finished epics stop crowding out
// active work as the board grows.
const COLLAPSE_KEY = 'agent-memory-sdk-board-collapsed';
let collapseOverrides = {};
try { collapseOverrides = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch (e) { collapseOverrides = {}; }

function isCollapsed(epicId, pct) {
  return Object.prototype.hasOwnProperty.call(collapseOverrides, epicId)
    ? collapseOverrides[epicId]
    : false;
}
function setCollapsed(epicId, val) {
  collapseOverrides[epicId] = val;
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapseOverrides));
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchTerm = '';
function matchesSearch(s) {
  if (!searchTerm) return true;
  return (s.id + ' ' + s.title + ' ' + s.summary).toLowerCase().includes(searchTerm);
}

// ── Render ───────────────────────────────────────────────────────────────────
// One swimlane per epic (title, description, progress bar, collapse toggle),
// each containing its own mini To Do / In Progress / Done columns scoped to
// just that epic's stories — replaces the old single flat 3-column board
// that mixed every epic's cards together with no grouping.
function render() {
  const cnt = { todo: 0, wip: 0, done: 0 };
  data.stories.forEach(s => cnt[COL_KEY[s.status]]++);
  ['todo', 'wip', 'done'].forEach(k => {
    document.getElementById('cnt' + k.charAt(0).toUpperCase() + k.slice(1)).textContent = cnt[k];
  });

  const lanesEl = document.getElementById('lanes');
  lanesEl.innerHTML = '';
  let anyLaneVisible = false;

  data.epics.forEach(epic => {
    const epicStories = data.stories.filter(s => s.epic_id === epic.id);
    const doneCount = epicStories.filter(s => s.status === 'Done').length;
    const pct = epicStories.length ? Math.round((doneCount / epicStories.length) * 100) : 0;
    const color = epicColor(epic.id);

    const visibleStories = epicStories.filter(matchesSearch);
    const laneHidden = !!searchTerm && visibleStories.length === 0;
    if (!laneHidden) anyLaneVisible = true;
    const collapsed = searchTerm ? false : isCollapsed(epic.id, pct);

    const lane = document.createElement('div');
    lane.className = 'lane' + (collapsed ? ' collapsed' : '') + (laneHidden ? ' hidden' : '');
    lane.style.setProperty('--epic-color', color);
    lane.dataset.epicId = epic.id;

    const miniCols = ['todo', 'wip', 'done'].map(col => {
      const storiesInCol = visibleStories.filter(s => COL_KEY[s.status] === col);
      const cardsHtml = storiesInCol.length
        ? storiesInCol.map(s => cardHtml(s, col)).join('')
        : '<div class="mini-col-empty">No stories</div>';
      return `
        <div class="mini-col">
          <div class="mini-col-header">
            <h4>${LABEL[col]}</h4>
            <span class="mini-count">${storiesInCol.length}</span>
            <span class="mini-col-indicator ind-${col}"></span>
          </div>
          <div class="mini-col-body">${cardsHtml}</div>
        </div>`;
    }).join('');

    lane.innerHTML = `
      <div class="lane-header" data-action="toggle-lane" data-epic="${epic.id}">
        <span class="lane-toggle">&#9660;</span>
        <span class="lane-tag">EPIC</span>
        <div class="lane-info">
          <h2><span class="lane-id">${epic.id}</span> ${epic.title}</h2>
          <p>${epic.description}</p>
        </div>
        <div class="lane-meta">
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${doneCount} / ${epicStories.length} done</div>
        </div>
      </div>
      <div class="lane-body">${miniCols}</div>`;

    lanesEl.appendChild(lane);
  });

  if (searchTerm && !anyLaneVisible) {
    lanesEl.innerHTML = `<div class="no-results">No stories match "${searchTerm}".</div>`;
  }
}

function cardHtml(s, col) {
  let btn = '';
  if (col === 'todo') btn = `<button class="move-btn" data-action="start" data-id="${s.id}">Start</button>`;
  if (col === 'wip')  btn = `<button class="move-btn back" data-action="back" data-id="${s.id}">Back</button>`;
  if (col === 'done') btn = `<button class="move-btn reset" data-action="reset" data-id="${s.id}">Reset</button>`;
  const nc = s.comments.length;
  return `
    <div class="card" data-id="${s.id}">
      <div class="card-id">${s.id}</div>
      <div class="card-title">${s.title}</div>
      <div class="card-summary">${s.summary}</div>
      <div class="card-footer">
        <span class="badge-type">Story</span>
        ${nc ? `<span class="badge-comments">&#128172; ${nc}</span>` : ''}
        ${btn}
      </div>
    </div>`;
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal(id) {
  const s = getStory(id);
  if (!s) return;
  activeId = id;
  document.getElementById('mId').textContent    = s.id;
  document.getElementById('mTitle').textContent  = s.title;
  document.getElementById('mDesc').textContent   = s.description;
  document.getElementById('mEpic').textContent   = (getEpic(s.epic_id) || {}).title || s.epic_id;
  document.getElementById('commentInput').value  = '';

  const badge = document.getElementById('mStatus');
  badge.textContent = s.status;
  badge.className   = 'status-badge ' + SC[s.status];

  // Comments
  const cl = document.getElementById('mComments');
  if (s.comments.length === 0) {
    cl.innerHTML = '<div class="no-comments">No comments yet.</div>';
  } else {
    cl.innerHTML = s.comments.map(raw => {
      const c = normalizeComment(raw);
      return `<div class="comment-item">${c.date ? `<div class="comment-date">${c.date}</div>` : ''}<div class="comment-text">${c.text}</div></div>`;
    }).join('');
  }

  const col = COL_KEY[s.status];
  document.getElementById('btnStart').style.display = col === 'todo' ? '' : 'none';
  document.getElementById('btnDone') .style.display = col === 'wip'  ? '' : 'none';
  document.getElementById('btnBack') .style.display = col === 'wip'  ? '' : 'none';
  document.getElementById('btnReset').style.display = col === 'done' ? '' : 'none';

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  activeId = null;
}

// ── Mutations (UI only — updates in-memory data; file edits use the JSON block) ──
function moveStory(id, action) {
  const s = getStory(id);
  if (!s) return;
  if (action === 'start') s.status = 'In Progress';
  if (action === 'done')  s.status = 'Done';
  if (action === 'back')  s.status = 'To Do';
  if (action === 'reset') s.status = 'To Do';
  toast(`${s.id} → ${s.status}`);
  render();
  if (activeId === id) openModal(id);
}

function addComment(id) {
  const s    = getStory(id);
  const text = document.getElementById('commentInput').value.trim();
  if (!s || !text) return;
  const today = new Date().toISOString().slice(0, 10);
  s.comments.push({ date: today, text });
  document.getElementById('commentInput').value = '';
  toast('Comment added (in-memory only — edit JSON block to persist)');
  render();
  openModal(id);
}

// ── Event delegation ─────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    e.stopPropagation();
    const action = actionBtn.dataset.action;
    if (action === 'toggle-lane') {
      const laneEl = actionBtn.closest('.lane');
      setCollapsed(actionBtn.dataset.epic, !laneEl.classList.contains('collapsed'));
      render();
      return;
    }
    moveStory(actionBtn.dataset.id, actionBtn.dataset.action);
    return;
  }
  const card = e.target.closest('.card');
  if (card) { openModal(card.dataset.id); return; }
  if (e.target.id === 'btnClose' || e.target.id === 'overlay') closeModal();
  if (e.target.id === 'btnStart')  moveStory(activeId, 'start');
  if (e.target.id === 'btnDone')   moveStory(activeId, 'done');
  if (e.target.id === 'btnBack')   moveStory(activeId, 'back');
  if (e.target.id === 'btnReset')  moveStory(activeId, 'reset');
  if (e.target.id === 'btnAddComment') addComment(activeId);
  if (e.target.id === 'btnExpandAll') {
    data.epics.forEach(epic => setCollapsed(epic.id, false));
    render();
  }
  if (e.target.id === 'btnCollapseAll') {
    data.epics.forEach(epic => setCollapsed(epic.id, true));
    render();
  }
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

render();
</script>
