[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling chosen over setuptools because:
#  - Zero-config src-layout discovery (no package_dir dance needed)
#  - Built-in version management via hatch-vcs or static string
#  - Faster, lighter build tree than setuptools for a library this size
#  - First-class PEP 517/518/660 support; editable installs work without
#    a legacy setup.py shim

[project]
name = "agent-memory-sdk"
version = "0.1.0"
description = "Governed multi-type memory system for AI agents backed by IBM Db2 LUW"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "memory", "db2", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # IBM Db2 native driver — pip install auto-downloads the bundled clidriver.
    # Set IBM_DB_HOME env var to use an existing full DB2 client instead.
    # On Windows Python 3.8+, os.add_dll_directory('<clidriver>/bin') must be
    # called before importing ibm_db (see db/connection.py for the guard).
    # Note: ibm_db_dbi is included in the ibm_db package — do not list it
    # as a separate dependency.
    "ibm_db>=3.2.9",
    # Pydantic v2 for models (Step 3+).
    "pydantic>=2.13.4",
    # python-dotenv for loading .env files in scripts / local dev.
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.5.3",
]
openai-agents = [
    "openai-agents>=0.19.1",
]
mcp = [
    "mcp>=1.19.0,<2",
]
# Microsoft Agent Framework (GA 2026-04-03, unifies AutoGen + Semantic
# Kernel) — ContextProvider/HistoryProvider adapter (PIPE-3). No version
# floor pinned yet: the package was not resolvable/installable from this
# environment at the time this extra was added (2026-08-02); tighten this
# once a real release is confirmed on PyPI.
agent-framework = [
    "agent-framework",
]
# Convenience: all adapters
all = [
    "agent-memory-sdk[langchain]",
    "agent-memory-sdk[openai-agents]",
    "agent-memory-sdk[mcp]",
    "agent-memory-sdk[agent-framework]",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "python-dotenv>=1.2.2",
    # Security scanning (PH-4)
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]
benchmark-core = [
    # pytest-benchmark for the four-tier benchmark suite.
    "pytest-benchmark>=5.0",
    # CodSpeed Valgrind instruction-count instrumentation.
    "pytest-codspeed>=2.2",
    # Memory/CPU instrumentation (resource_sampler.py). Linux+macOS only.
    "pytest-memray>=1.6.0",
    "psutil>=6.0",
]
benchmark-load = [
    "agent-memory-sdk[benchmark-core]",
    # Locust concurrency harness.
    "locust>=2.26",
]
benchmark-quality = [
    "agent-memory-sdk[benchmark-core]",
    # Real embedding/judge providers for quality benchmarks.
    "sentence-transformers>=5.6.1",
    "ollama>=0.6.2",
    # HuggingFace datasets for LongMemEval corpus.
    "datasets>=2.14",
]
# Convenience: full benchmark stack — all of the above.
# Use benchmark-load or benchmark-quality for narrower CI installs.
benchmark = [
    "agent-memory-sdk[benchmark-load]",
    "agent-memory-sdk[benchmark-quality]",
    # --benchmark-histogram flag support (local runs only; not used in CI).
    # Without pygal+pygaljs the flag crashes with ImportError.
    "pygal>=3.0",
    "pygaljs>=1.0.2",
]

[project.urls]
Repository = "https://github.com/oss-ai-connector/agent-memory-sdk"

# ── Hatchling source layout ──────────────────────────────────────────────────
# NOTE: `packages` below is the *only* thing that ends up in the built wheel —
# everything else in the repo (project-management/, benchmarks/, scripts/,
# tests/) is excluded from the wheel by omission, not by an explicit exclude
# list. benchmarks/ gets the same treatment as project-management/: real,
# checked-in, run on demand (`make benchmark`), never shipped to end users
# installing the package from PyPI.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_sdk"]

# ── Ruff (linting + formatting) ──────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length enforced by formatter, not lint

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
ignore_missing_imports = true   # ibm_db has no stubs

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=agent_memory_sdk",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "integration: requires a live Db2 instance (skip with -m 'not integration')",
    # EPIC-13 BM-3: four-tier benchmark markers — see benchmarks/README.md
    "benchmark_micro: Tier 0 — CPU-only micro-benchmarks, no database required",
    "benchmark_pr: Tier 1 — single-op latency against Db2; runs on every PR",
    "benchmark_nightly: Tier 2 — concurrency/scale benchmarks; runs on schedule",
    "benchmark_scale: Tier 3 — full-scale sweep; runs weekly or on demand",
]

[tool.coverage.run]
source = ["src/agent_memory_sdk"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
# Don't count lines that can never be hit in a mocked test environment
# (e.g. the ibm_db import guard that only triggers when the C extension
# is absent).  Lines explicitly excluded with `# pragma: no cover` are
# already omitted by default.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# NOTE: After modifying [tool.uv.sources] or [[tool.uv.index]], run `uv lock`
# to regenerate uv.lock and commit the updated lock file.

# ── uv source overrides ──────────────────────────────────────────────────────
# Use the CPU-only PyTorch index on CI runners (no GPU). This cuts the torch
# wheel from ~527 MB to ~200 MB. The +cpu variant produces identical embeddings
# to the CUDA wheel on CPU-only hardware (CIW-5).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
